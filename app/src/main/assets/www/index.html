<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mimi课表</title>
    <script>
    (function(){
        var g = '0';
        try { if (window.Android && Android.getGlassUi) g = Android.getGlassUi() || '0'; } catch(e) {}
        document.documentElement.setAttribute('data-glass', g === '1' ? '1' : '0');
    })();
    </script>
    <style>
        /* 内置中文衬线（思源宋体子集），保证所有机型都是同一套字形 */
        @font-face {
            font-family: 'Mi Serif';
            src: url('../fonts/mi-serif.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        :root{
            --primary:#C96442;
            --primary-soft:rgba(201,100,66,0.12);
            --bg:#F5F4ED;
            --card:#FAF9F5;
            --text:#141413;
            --sub:#87867F;
            --input-bg:#FAF9F5;
            --input-border:#E8E6DC;
            --secondary:#5E5D59;--glass-hi:rgba(255,255,255,0);--glass-glow:rgba(255,255,255,0);--glass-g1:#F5F4ED;--glass-g2:#F5F4ED;--glass-g3:#F5F4ED;--glass-card:#FAF9F5;--glass-card-soft:#F5F4ED;--glass-border:#E8E6DC;--glass-shadow:rgba(20,20,19,0.08);--glass-edge:rgba(255,255,255,0);--glass-refract:rgba(255,255,255,0);
            --bf: none;
        }
        /* 动态玻璃效果开关：默认关闭=纯实色普通UI；开启=强毛玻璃 */
        html[data-glass="1"]{
            --glass-hi:rgba(255,255,255,0.58);
            --glass-glow:rgba(255,255,255,0.30);
            --glass-g1:#F3EBDF;--glass-g2:#EFE7DA;--glass-g3:#E9E5DA;
            --glass-card:rgba(250,249,245,0.52);
            --glass-card-soft:rgba(250,249,245,0.40);
            --glass-border:rgba(255,255,255,0.55);
            --glass-shadow:rgba(20,20,19,0.12);
            --glass-edge:rgba(255,255,255,0.55);
            --glass-refract:rgba(255,255,255,0.20);
            --bf: blur(22px) saturate(138%);
        }
        html[data-glass="0"] body::before { content: none; }
        /* 玻璃模式背景：暖奶油纸面 + 赤陶微光，像描图纸而非科技毛玻璃 */
        html[data-glass="1"] body::before {
            background:
                radial-gradient(120vmax 90vmax at 50% 118%, rgba(255,255,255,0.26), rgba(255,255,255,0) 62%),
                radial-gradient(80vmax 80vmax at 12% -10%, rgba(201,100,66,0.10), rgba(201,100,66,0) 55%),
                linear-gradient(125deg, #F3EBDF 0%, #EFE7DA 26%, #E9E5DA 48%, #F0E9DE 72%, #F3EBDF 100%);
            background-size: 100% 100%;
            animation: lg-flow 40s ease-in-out infinite alternate;
            will-change: transform;
        }
        @keyframes lg-flow {
            0% { transform: translate3d(0,0,0); }
            50% { transform: translate3d(-2.5vmax, 1.6vmax, 0); }
            100% { transform: translate3d(1.6vmax, -2.5vmax, 0); }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* 待机态：无进度条、文字居中 */
        .login-progress.idle .login-progress-track { display: none; }
        .login-progress.idle .login-progress-text { flex: 1; text-align: center; }
        .login-progress-track { display: none !important; }

        body {
            font-family: "Mi Serif", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif;
            background: var(--bg);
            padding: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            /* 内置衬线只有常规字重，笔画偏细：用文字描边补一点厚度 */
            -webkit-text-stroke: 0.32px currentColor;
        }
        /* 表单控件默认使用系统无衬线，这里统一继承衬线，保证全 App 字体一致 */
        button, input, select, textarea { font-family: inherit; }
        /* Claude 排版：全站统一衬线字体，标题用常规字重（不用 bold） */
        h1, h2, .wk-title, .topbar h1, .page-title {
            font-family: "Mi Serif", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif;
            font-weight: 400;
            letter-spacing: 0.3px;
            line-height: 1.3;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        /* 卡片：暖色 ring 边框 + 微尘阴影 */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #F0EEE6;
            box-shadow: 0 0 0 1px rgba(201,100,66,0.13), rgba(0,0,0,0.05) 0 4px 24px;
            margin-bottom: 16px;
        }
        h1 { font-size: 26px; margin-bottom: 20px; text-align: center; color: var(--text); }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            color: var(--sub);
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 16px;
            transition: 0.2s;
            background: var(--glass-card-soft);
            backdrop-filter: var(--bf);
            -webkit-backdrop-filter: var(--bf);
            box-shadow: inset 0 1px 0 var(--glass-hi);
            color: var(--text);
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card);
            /* 内发光代替外扩散：聚焦时输入框外框尺寸与未聚焦完全一致，
               密码框和上面的学号框严格等宽对齐，不再向外“凸”一圈 */
            box-shadow: inset 0 0 0 2px var(--primary-soft);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--glass-card-soft);
            color: var(--text);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: var(--bf);
            -webkit-backdrop-filter: var(--bf);
            box-shadow: 0 4px 14px var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
            transition: 0.2s;
            margin-top: 8px;
        }
        button:active { opacity: 0.85; }
        .btn-secondary {
            background: var(--glass-card);
            margin-top: 12px;
        }
        .tip {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }
        .tip.ok { display: none; }
        .tip.err { background: #ffebee; color: #c62828; }

        /* ===== 问候卡（2.5：时间/日期问候/励志语/天气） ===== */
        .hello-card {
            background: var(--glass-card-soft);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--bf);
            -webkit-backdrop-filter: var(--bf);
            border-radius: 12px;
            padding: 12px 14px;
            margin: 0 0 12px;
        }
        .hello-top { display: flex; align-items: baseline; gap: 10px; }
        .hello-time {
            font-family: "Mi Serif", "Noto Serif CJK SC", "Songti SC", serif;
            font-size: 27px; font-weight: 400; color: var(--text); letter-spacing: .2px; font-variant-numeric: tabular-nums; line-height: 1.2;
        }
        .hello-greet { font-size: 13px; font-weight: 500; color: var(--primary); }
        .hello-time .hh-sec { font-size: .55em; font-weight: 400; opacity: .62; margin-left: 1px; }
        .hello-date { font-size: 12px; color: var(--sub); margin-top: 2px; }
        .hello-quote {
            font-size: 12.5px; color: var(--sub); line-height: 1.65;
            margin-top: 9px; padding: 8px 10px;
            background: var(--primary-soft); border-radius: 10px;
        }
        .hello-quote .q-src { opacity: .75; font-size: 11px; margin-left: 4px; }
        .hello-weather {
            margin-top: 10px; display: flex; align-items: center; gap: 7px;
            font-size: 12.5px; color: var(--sub);
        }
        #hhWIcon { display: inline-flex; line-height: 0; }
        .hello-weather svg { width: 15px; height: 15px; flex: 0 0 15px; color: var(--primary); }
        .hw-city {
            margin-left: auto; color: var(--primary); font-weight: 500;
            padding: 2px 9px; background: var(--primary-soft);
            border-radius: 8px; cursor: pointer;
            transition: transform .15s cubic-bezier(.2,.8,.2,1);
        }
        .hw-city:active { transform: scale(.94); }
        /* ===== 课表页顶部信息条：默认一条细线框，点击展开为主界面同款问候卡 ===== */
        .tt-hello-slot { margin: 0 2px 12px; }
        .hello-mini-chev { display: none; }
        .hello-card.tt-mini { margin: 0; cursor: pointer; }
        .hello-card.tt-mini:not(.tt-open) {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 12px; min-height: 34px;
            border-radius: 10px;
            background: var(--glass-card-soft);
            box-shadow: inset 0 1px 0 var(--glass-hi);
            overflow: hidden;
        }
        .hello-card.tt-mini:not(.tt-open) .hello-top {
            display: flex; align-items: baseline; gap: 6px; flex: 0 0 auto;
        }
        .hello-card.tt-mini:not(.tt-open) .hello-time { font-size: 15px; line-height: 1.15; }
        .hello-card.tt-mini:not(.tt-open) .hello-greet { font-size: 11.5px; white-space: nowrap; }
        .hello-card.tt-mini:not(.tt-open) .hello-date,
        .hello-card.tt-mini:not(.tt-open) .hello-quote { display: none; }
        .hello-card.tt-mini:not(.tt-open) .hello-weather {
            margin: 0 0 0 auto; font-size: 11.5px; gap: 5px;
            min-width: 0; white-space: nowrap;
        }
        .hello-card.tt-mini:not(.tt-open) #hhWIcon,
        .hello-card.tt-mini:not(.tt-open) .hw-city { display: none; }
        .hello-card.tt-mini:not(.tt-open) #hhWText {
            overflow: hidden; text-overflow: ellipsis; max-width: 34vw;
        }
        .hello-card.tt-mini:not(.tt-open) .hello-mini-chev {
            display: inline-flex; flex: 0 0 auto;
            font-size: 11px; color: var(--sub); line-height: 1;
        }
        .hello-card.tt-mini.tt-open .hello-mini-chev {
            display: block; text-align: center;
            margin-top: 8px; font-size: 11px; color: var(--sub);
        }
        #cityMask {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 70;
        }
        /* 城市输入弹窗：屏幕正中的小卡片，只保留一个输入框 */
        #cityPanel {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: min(86vw, 340px);
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            z-index: 71;
        }
        #cityPanel h2 { font-size: 17px; color: var(--text); margin-bottom: 14px; text-align: center; }
        #cityPanel input { font-size: 15px; }
        .city-hint {
            min-height: 18px;
            margin-top: 8px;
            font-size: 12px;
            text-align: center;
            color: var(--sub);
        }
        .city-hint.err { color: #c62828; }
        .city-btns { display: flex; gap: 10px; margin-top: 6px; }
        .city-btns button { flex: 1; margin-top: 0; padding: 11px; font-size: 15px; }
        .city-btns .city-cancel { flex: 0 0 96px; background: var(--glass-card); }
        .hidden { display: none; }
        /* ===== 动态玻璃增强层（2.6：叠加在 2.1 原 UI 之上，不改布局/尺寸） ===== */
        body::before {
            content: '';
            position: fixed;
            top: -12vmax; left: -12vmax; right: -12vmax; bottom: -12vmax;
            z-index: -1;
            background: linear-gradient(135deg, var(--glass-g1), var(--glass-g2), var(--glass-g3), var(--glass-g2), var(--glass-g1));
            background-size: 400% 400%;
        }
        .card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--bf);
            -webkit-backdrop-filter: var(--bf);
            box-shadow: 0 10px 34px var(--glass-shadow), inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(255,255,255,0.10);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute; left: 0; right: 0; top: 0; height: 42%;
            pointer-events: none;
            background: linear-gradient(180deg, var(--glass-glow), rgba(255,255,255,0));
        }
        .gcard {
            background: var(--glass-card-soft);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--bf);
            -webkit-backdrop-filter: var(--bf);
            box-shadow: inset 0 1px 0 var(--glass-hi);
        }
        #cityPanel {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            backdrop-filter: var(--bf);
            -webkit-backdrop-filter: var(--bf);
            box-shadow: 0 -8px 30px var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        }
        .btn { box-shadow: inset 0 1px 0 rgba(255,255,255,0.28); }
        /* 玻璃模式：按钮与内容区强化毛玻璃质感。
           彩色按钮（确认/保存/日程类型/色点/全屏）排除在外，保留各自的实色底，
           否则玻璃渐变会盖掉赤陶底，白字直接看不见 */
        html[data-glass="1"] button:not(.clear-btn):not(.copy-log-link):not(.confirm-btn):not(.sch-save):not(.sch-mode-btn):not(.sch-color-dot):not(.wk-fullscreen-btn) {
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(255,255,255,0.46), rgba(255,255,255,0.22));
            box-shadow: 0 6px 18px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.62), inset 0 -1px 0 rgba(255,255,255,0.16);
        }
        /* 玻璃层里的按钮文字改用纯色填充、取消全局细描边：
           描边+ backdrop-filter 在部分 WebView 重绘时会漏画字形，表现为文字偶发空白 */
        html[data-glass="1"] button {
            -webkit-text-stroke: 0;
            -webkit-text-fill-color: currentColor;
        }
        /* 按下时不再叠加 filter：filter 与 backdrop-filter 同层会让部分 WebView 重绘丢失文字 */
        html[data-glass="1"] button:active { filter: none; }
        html[data-glass="1"] .course-list:not(.wk) {
            background: rgba(250,249,245,0.34);
            border: 1px solid var(--glass-border);
        }
        html[data-glass="1"] .card {
            background: linear-gradient(165deg, rgba(255,255,255,0.48), rgba(255,255,255,0.24) 45%, rgba(255,255,255,0.34));
            box-shadow: 0 12px 36px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.78), inset 0 -1px 0 rgba(255,255,255,0.18);
        }
        html[data-glass="1"] #loginBtn { border-radius: 12px; }
        /* ===== 液态玻璃增强：湿边高光 + 折射内影 + 缓慢流光 ===== */
        html[data-glass="1"] .hello-card,
        html[data-glass="1"] .gcard {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 26px var(--glass-shadow),
                        inset 0 1px 0 var(--glass-hi),
                        inset 1px 0 0 var(--glass-refract),
                        inset -1px 0 0 rgba(255,255,255,0.12);
        }
        html[data-glass="1"] .card {
            border-color: var(--glass-border);
            box-shadow: 0 14px 42px var(--glass-shadow),
                        inset 0 1px 0 rgba(255,255,255,0.80),
                        inset 0 -1px 0 rgba(255,255,255,0.20),
                        inset 1px 0 0 var(--glass-refract);
        }
        html[data-glass="1"] .hello-card::after {
            content: '';
            position: absolute; left: -30%; top: -60%;
            width: 160%; height: 130%;
            pointer-events: none;
            background: linear-gradient(115deg,
                rgba(255,255,255,0) 32%,
                rgba(255,255,255,0.26) 47%,
                rgba(255,255,255,0.08) 58%,
                rgba(255,255,255,0) 70%);
            transform: translate3d(-18%, 0, 0) rotate(6deg);
            animation: lg-sheen 16s ease-in-out infinite alternate;
            will-change: transform;
        }
        @keyframes lg-sheen {
            from { transform: translate3d(-18%, 0, 0) rotate(6deg); }
            to { transform: translate3d(18%, 0, 0) rotate(6deg); }
        }
        /* 主登录按钮：赤陶主色 */
        #loginBtn { background: var(--primary); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(201,100,66,0.34), inset 0 1px 0 rgba(255,255,255,0.18); }
        /* 返回主界面按钮：缩小并居中 */
        #logoutBtn { width: auto; display: block; margin: 12px auto 0; padding: 9px 26px; font-size: 13.5px; border-radius: 12px; }
        /* 玻璃模式：记住密码控件玻璃化 */
        html[data-glass="1"] .checkbox-row {
            background: linear-gradient(180deg, rgba(255,255,255,0.30), rgba(255,255,255,0.13));
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 9px 14px;
            backdrop-filter: var(--bf);
            -webkit-backdrop-filter: var(--bf);
            box-shadow: 0 6px 18px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.55);
        }
        /* 清空账号密码确认弹窗 */
        .confirm-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,30,50,0.38); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .confirm-mask.hidden { display: none; }
        .confirm-card { width: 78%; max-width: 320px; background: var(--card); border-radius: 18px; padding: 20px 18px 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.22); text-align: center; }
        .confirm-title { font-size: 15.5px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .confirm-text { font-size: 13.5px; color: var(--sub); margin-bottom: 18px; }
        .confirm-btns { display: flex; gap: 10px; }
        .confirm-btn { flex: 1; margin: 0; padding: 10px 0; font-size: 14px; border-radius: 10px; border: none; font-weight: 500; }
        .confirm-btn.cancel { background: #EFEDE4; color: #4D4C48; }
        .confirm-btn.ok { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(201,100,66,0.30), inset 0 1px 0 rgba(255,255,255,0.16); }
        html[data-glass="1"] .confirm-card { background: linear-gradient(165deg, rgba(255,255,255,0.38), rgba(255,255,255,0.16) 45%, rgba(255,255,255,0.24)); border: 1px solid var(--glass-border); backdrop-filter: var(--bf); -webkit-backdrop-filter: var(--bf); box-shadow: 0 14px 44px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.75); }
        html[data-glass="1"] .confirm-btn.cancel { background: rgba(255,255,255,0.28); }
        /* 课程卡片节次别名：下划线提示可点开查看具体时间 */
        .wk-alias { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
        /* 节次时间弹窗列表 */
        .slot-time-list { margin: 4px 0 14px; text-align: left; }
        .slot-time-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 9px; font-size: 13px; color: var(--sub); }
        .slot-time-row b { font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
        .slot-time-row.on { background: var(--input-bg); }
        .slot-time-row.on, .slot-time-row.on b { color: var(--primary); }
        .slot-time-row.on b { font-weight: 600; }
        /* 课程详情弹层 */
        .cd-name { font-size: 15px; font-weight: 500; color: var(--text); text-align: left; margin: 2px 0 8px; word-break: break-all; }
        .cd-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 7px 10px; border-radius: 9px; font-size: 13px; color: var(--sub); text-align: left; }
        .cd-row b { font-weight: 500; color: var(--text); text-align: right; word-break: break-all; }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .card, .gcard, #cityPanel { background: var(--card); }
        }
        button { transition: transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .2s, opacity .2s, filter .2s; }
        button:active { transform: scale(.97); filter: brightness(1.05); }
        button:disabled { transform: none; }
        .copy-log-link { transition: transform .15s cubic-bezier(.2,.8,.2,1); }
        .copy-log-link:active { transform: scale(.95); opacity: 1; }
        .hw-city { transition: transform .15s cubic-bezier(.2,.8,.2,1); }
        .hw-city:active { transform: scale(.94); }
        .hello-card { transition: transform .15s cubic-bezier(.2,.8,.2,1); }
        .hello-card:active { transform: scale(.995); }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .btn-group button {
            flex: 1;
            min-width: 70px;
            margin-top: 0;
            padding: 10px;
            font-size: 14px;
        }
        /* ===== 选周等待提示 ===== */
        .course-list {
            background: var(--input-bg);
            color: var(--text);
            padding: 16px;
            border-radius: 12px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            font-family: "Mi Serif", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif;
        }
        /* ===== 选周等待提示 ===== */
        .wk-hint { text-align: center; color: var(--sub); font-size: 13px; padding: 20px 8px; }
        /* ===== 课表卡片视图（2.3 新增：替代原生网格与文本视图） ===== */
        .course-list.wk {
            font-family: inherit;
            white-space: normal;
            font-size: 14px;
            padding: 12px;
            background: transparent;
            max-height: none;
            overflow: visible;
        }
        /* ===== 标准周课表网格（2.5.4） ===== */
        .wk-grid-wrap {
            margin: 2px 0 16px; border-radius: 16px; overflow: hidden;
            background: var(--glass-card); border: 1px solid var(--glass-border);
            backdrop-filter: var(--bf);
            -webkit-backdrop-filter: var(--bf);
            box-shadow: 0 8px 26px var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
            position: relative;
        }
        /* 全屏按钮已移到 wk-title 行内，此处不再保留 wk-grid-wrap 内嵌按钮样式 */
        .wk-grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .wk-grid { display: grid; grid-template-columns: 30px repeat(7, 1fr); min-width: 540px; }
        .wkg-corner { background: var(--input-bg); border-right: 1px solid var(--input-border); border-bottom: 1px solid var(--input-border); }
        .wkg-head {
            padding: 8px 0 6px; text-align: center; font-size: 11px; font-weight: 500; letter-spacing: 0.3px;
            color: var(--sub); border-right: 1px solid var(--input-border); border-bottom: 1px solid var(--input-border);
        }
        .wkg-head small { display: block; font-size: 9px; font-weight: 400; margin-top: 1px; }
        .wkg-head.today { color: var(--primary); background: var(--primary-soft); }
        .wkg-slot {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 9px; color: var(--sub); height: 56px; padding: 2px 0;
            background: var(--input-bg); border-right: 1px solid var(--input-border); border-bottom: 1px solid var(--input-border);
        }
        .wkg-slot small { font-size: 8px; margin-top: 1px; font-weight: 400; }
        .wkg-cell {
            position: relative;
            height: 56px; padding: 2px; display: flex; flex-direction: column; gap: 2px;
            border-right: 1px solid var(--input-border); border-bottom: 1px solid var(--input-border);
            overflow: hidden;
            --cell-h: 56px;
        }
        /* 单点提醒：圆点压在最左侧边框上，不遮挡课程文字 */
        .wkg-line {
            position: absolute; left: -3px; width: 13px; height: 14px;
            display: flex; align-items: center; justify-content: center;
            transform: translateY(-50%); cursor: pointer; z-index: 4;
        }
        .wkg-line::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--wk-accent); box-shadow: 0 0 0 1.5px rgba(255,255,255,0.9);
        }
        /* 单点提醒详情浮层 */
        #remindPop {
            position: fixed; z-index: 9999; min-width: 150px; max-width: 230px;
            background: var(--card); border-radius: 12px; padding: 11px 13px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.22); border: 1px solid var(--input-border);
        }
        #remindPop .rp-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
        #remindPop .rp-row { font-size: 12px; color: var(--sub); line-height: 1.6; }
        #remindPop .rp-row b { color: var(--text); font-weight: 500; }
        .wkg-cell.today { background: var(--primary-soft); }
        .wkg-course {
            flex: 1; min-height: 0; border-radius: 7px; padding: 2px 3px; font-size: 9px; line-height: 1.2;
            background: var(--wk-accent-soft); box-shadow: inset 0 0 0 1px var(--wk-accent);
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1px;
        }
        /* 可点击的课程卡（带 data-cid）：给出明确的触摸反馈 */
        .wkg-course[data-cid] { cursor: pointer; }
        .wkg-course[data-cid]:active { opacity: 0.78; }
        .wkg-course span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; color: var(--text); font-size: 9px; font-weight: 500; max-width: 100%; }
        .wkg-course small { max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; white-space: normal; line-height: 1.15; font-size: 7.5px; color: var(--sub); }
        /* 课程名的「前 4 字」副本：普通视图和横屏全屏不显示，仅竖屏全屏使用 */
        .wkg-course .wkg-cshort { display: none; }
        /* 日程卡片（周视图网格）：颜色跟随日程自选色（默认玫红） */
        .wkg-course.sch-item {
            background: var(--wk-accent-soft);
            box-shadow: inset 0 0 0 1px var(--wk-accent);
        }
        .wkg-course.sch-item span { color: var(--wk-accent); font-weight: 500; }
        .wkg-course.sch-item small { color: var(--wk-accent); opacity: 0.85; }
        .wk-title {
            font-size: 17px; font-weight: 500; color: var(--text);
            margin: 2px 2px 10px; display: flex; align-items: center; gap: 8px;
            position: relative; flex-wrap: nowrap;
        }
        /* 标题文字必须是独立 span（裸文本节点不受 flex-shrink 选择器约束，会被压成竖排） */
        .wk-title-text { flex: 0 0 auto; white-space: nowrap; }
        .wk-title-spacer { flex: 1 1 auto; min-width: 0; }
        .wk-week-badge {
            display: inline-block; padding: 2px 10px; border-radius: 10px;
            background: #F7E6DC; color: #A6512F; font-size: 12px; font-weight: 600;
            border: 1px solid #EBC9B7; letter-spacing: 0.3px;
            white-space: nowrap; flex: 0 0 auto;
        }
        /* 全屏角标：尺寸与"第X周"徽标一致。必须显式 width:auto / margin:0，
           否则会被全局 button{width:100%} 撑成整条，flex-basis 会回退到该宽度 */
        .wk-fullscreen-btn {
            flex: 0 0 auto;
            width: auto; margin: 0;
            padding: 2px 7px; border-radius: 10px; border: 1px solid #EBC9B7;
            background: #F7E6DC; color: #A6512F;
            font-size: 11px; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            line-height: 1.2; white-space: nowrap; min-width: 24px;
            box-shadow: none;
        }
        .wk-fullscreen-btn:active { transform: scale(0.94); }
        /* 全屏模式样式（针对整个 courseContent） */
        /* 全屏模式：一屏完整显示 7 天 × 6 节次，外观对齐教务系统的周课表：
           表格紧凑、只显示课程名（不显示地点/教师），行高由 JS 按可视区计算并封顶（--fs-row）
           用 .wk-fs 类而不是 :fullscreen 伪类，兼容不支持 unprefixed 伪类的旧 WebView */
        #courseContent.wk-fs {
            background: var(--bg, #F5F4ED);
            overflow: hidden;
            max-height: none;
            height: 100vh;
            display: flex; flex-direction: column;
            box-sizing: border-box;
            padding: 0 5px 6px;
            padding-top: 44px;   /* 避开系统状态栏，保证右上角 ✕ 可点 */
        }
        #courseContent.wk-fs .wk-title {
            font-size: 14px; margin: 0 3px 4px; flex: 0 0 auto;
        }
        #courseContent.wk-fs .wk-week-badge { font-size: 11px; padding: 0 6px; }
        #courseContent.wk-fs .wk-fullscreen-btn {
            font-size: 13px; padding: 0 9px; line-height: 18px;
            position: static; z-index: auto;
        }
        /* 全屏只显示网格课表，隐藏下方的日视图卡片列表 */
        #courseContent.wk-fs .wk-day,
        #courseContent.wk-fs .wk-note,
        #courseContent.wk-fs .wk-subtitle,
        #courseContent.wk-fs .wk-actions {
            display: none;
        }
        #courseContent.wk-fs .wk-grid-wrap {
            flex: 0 0 auto; margin: 0; min-height: 0;
            display: flex; flex-direction: column;
            background: var(--card); border: 1px solid var(--input-border);
            box-shadow: none; border-radius: 10px; overflow: hidden;
        }
        #courseContent.wk-fs .wk-grid-scroll {
            flex: 0 0 auto; min-height: 0;
            overflow: hidden;
        }
        #courseContent.wk-fs .wk-grid {
            display: grid;
            grid-template-columns: 36px repeat(7, minmax(0, 1fr));
            grid-template-rows: auto repeat(6, var(--fs-row, 56px));
            width: 100%; min-width: 0;
        }
        #courseContent.wk-fs .wkg-corner,
        #courseContent.wk-fs .wkg-head { background: var(--input-bg); }
        #courseContent.wk-fs .wkg-head {
            font-size: 10.5px; padding: 4px 0 3px; text-align: center; line-height: 1.2;
        }
        #courseContent.wk-fs .wkg-head small { font-size: 8.5px; display: block; line-height: 1.1; margin-top: 1px; }
        #courseContent.wk-fs .wkg-corner { height: 100%; }
        #courseContent.wk-fs .wkg-slot {
            font-size: 8.5px; padding: 1px 0; height: var(--fs-row, 56px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            overflow: hidden; line-height: 1.15;
        }
        #courseContent.wk-fs .wkg-slot small { font-size: 7.5px; margin-top: 1px; font-weight: 400; display: block; line-height: 1.1; }
        #courseContent.wk-fs .wkg-cell {
            height: var(--fs-row, 56px);
            --cell-h: var(--fs-row, 56px);
            padding: 2px; gap: 2px;
            overflow: hidden;
        }
        /* 跨格日程的外框要能越过本格继续向下延伸，不能被单格裁掉 */
        #courseContent.wk-fs .wkg-cell.has-span { overflow: visible; z-index: 6; }
        /* 全屏课程卡片：只显示课程名（不显示地点/教师），最多两行，超出省略 */
        #courseContent.wk-fs .wkg-course {
            flex: 1 1 0; min-height: 0;
            padding: 2px 2px; margin: 0; border-radius: 5px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; line-height: 1.25;
            overflow: hidden;
        }
        #courseContent.wk-fs .wkg-course span {
            font-size: 11.5px; font-weight: 500;
            width: 100%; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            white-space: normal; word-break: break-all;
        }
        /* 竖屏全屏：课程名只显示前 4 个字（单行，字号随屏宽自适应） */
        #courseContent.wk-fs .wkg-course .wkg-cname { display: none; }
        #courseContent.wk-fs .wkg-course .wkg-cshort {
            display: block; width: auto; max-width: 100%;
            font-size: 10px; font-size: clamp(8px, 2.5vw, 11px);
            line-height: 1.25; letter-spacing: -0.2px;
            white-space: nowrap; text-overflow: ellipsis;
            word-break: keep-all; overflow: hidden;
        }
        #courseContent.wk-fs .wkg-course small { display: none; }
        /* 横屏全屏：恢复完整课程名 + 地点 */
        @media (orientation: landscape) {
            #courseContent.wk-fs .wkg-course .wkg-cname {
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                white-space: normal; word-break: break-all;
            }
            #courseContent.wk-fs .wkg-course .wkg-cshort { display: none; }
            #courseContent.wk-fs .wkg-course small { display: -webkit-box; }
        }
        /* 全屏日程框：删除时间，标题每行 2 个字（2×2 排布更整齐），框本身裁剪防溢出 */
        #courseContent.wk-fs .wkg-span { overflow: hidden; }
        #courseContent.wk-fs .wkg-span-page { padding: 3px 3px; font-size: 10px; }
        #courseContent.wk-fs .wkg-span.solid .wkg-span-page > span,
        #courseContent.wk-fs .wkg-span.sch-active .wkg-span-page > span {
            width: 2.15em; margin: 0 auto; font-size: 11px; line-height: 1.25;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            white-space: normal; word-break: break-all; overflow: hidden;
        }
        #courseContent.wk-fs .wkg-span-page > small { display: none; }
        .wk-note { text-align: center; color: var(--sub); font-size: 11px; margin: 0 0 12px; }
        .wk-day { margin-bottom: 14px; }
        .wk-day-head {

        }

        .wk-date { font-weight: 500; font-size: 12px; opacity: .85; }
        .wk-cnt {

        .wk-name {

        /* 重点信息框：小节(含别名)、地点、任课教师，字号小于课程名(14px) */
        .wk-hl {

        .pwd-wrap { position: relative; width: 100%; }

        /* 密码掩码：不再依赖字体里的圆点字形（各机型宽度不同，容易挤成一坨）。
           这里把原生文字设为透明，由 .pwd-dots 自绘等距圆点，保证任何机型都清晰可数 */
        .pwd-wrap input[type="password"] {

            font-size: 15px; font-weight: 600; margin-top: 0; width: auto;
        }
        .sch-cancel { background: #EFEDE4; color: #5E5D59; box-shadow: none; }
        .sch-save { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(201,100,66,0.28); }
        /* 日程颜色选择：一排可点色点，选中外描边 */
        .sch-colors { display: flex; gap: 10px; flex-wrap: wrap; }
        .sch-color-dot {
            width: 28px; height: 28px; border-radius: 50%; padding: 0; margin: 0;
            border: 2.5px solid transparent; box-sizing: border-box;
            transition: transform .12s ease, border-color .12s ease;
        }
        .sch-color-dot.on { border-color: var(--text); transform: scale(1.12); }
        /* 课表内的日程项：玫红标识，图标与课程一致为软底+首字；徽标强制横排不换行 */
        .sch-badge {
            display: inline-block; flex: 0 0 auto; white-space: nowrap;
            font-size: 10px; font-weight: 600;
            background: #D97757; color: #fff; border-radius: 5px;
            padding: 1px 6px; margin-left: 6px; vertical-align: 2px;
        }
        /* 同格多项：翻页卡片 + 数量角标 */
        .wkg-pager { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .wkg-pg { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .wkg-pg .wkg-course { margin: 0; }
        .wkg-badge {
            position: absolute; top: 0; right: 0; z-index: 2;
            min-width: 11px; height: 11px; border-radius: 6px;
            background: var(--primary); color: #fff;
            font-size: 6.5px; font-weight: 500; line-height: 11px;
            text-align: center; padding: 0 2px; box-sizing: border-box;
            box-shadow: 0 1px 2px rgba(0,0,0,0.25);
        }
        /* ===== 跨格日程：外圈描边框浮在课程之上，框内透明透出课程；
           点框中间展开为不透明卡片盖住下方内容，再点收回成一圈框 ===== */
        .wkg-cell.has-span { overflow: visible; z-index: 6; }
        .wkg-cell.z-top { z-index: 20; }
        .wkg-span {
            position: absolute; top: 2px; left: 2px; right: 2px;
            height: calc(var(--span, 1) * (var(--cell-h, 56px) + 1px) - 5px);
            z-index: 5; cursor: pointer;
        }
        .wkg-span .wkg-pg { position: absolute; inset: 0; }
        .wkg-span-page {
            position: absolute; inset: 0; border-radius: 8px;
            box-shadow: inset 0 0 0 2px var(--wk-accent);
            background: transparent;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 1px; padding: 2px 3px; overflow: hidden;
        }
        /* 收起态：只有外框，文字全部隐藏，课程完整透出 */
        .wkg-span-page > span, .wkg-span-page > small { display: none; }
        /* 该格没有任何课程时不需要透出，直接实底显示日程内容 */
        .wkg-span.solid .wkg-span-page {
            background: var(--card);
            box-shadow: inset 0 0 0 2px var(--wk-accent);
        }
        /* 展开态：不透明卡片盖住下方课程，只显示当前日程内容 */
        .wkg-span.sch-active .wkg-span-page {
            background: var(--card);
            box-shadow: inset 0 0 0 2px var(--wk-accent), 0 6px 18px rgba(0,0,0,0.16);
        }
        .wkg-span.sch-active .wkg-span-page > span,
        .wkg-span.solid .wkg-span-page > span { display: block; font-size: 9px; font-weight: 500; color: var(--wk-accent); }
        .wkg-span.sch-active .wkg-span-page > small,
        .wkg-span.solid .wkg-span-page > small { display: block; font-size: 7.5px; color: var(--sub); line-height: 1.15; }
    </style>
    <link rel="stylesheet" href="wheel.css">
</head>
<body>
<div class="container">
    <div class="card" id="login-page">
        <h1>Mimi课表</h1>
        <div class="hello-card" id="hhCard">
            <div class="hello-top">
                <span class="hello-time" id="hhTime">--:--</span>
                <span class="hello-greet" id="hhGreet"></span>
            </div>
            <div class="hello-date" id="hhDate"></div>
            <div class="hello-quote" id="hhQuote"></div>
            <div class="hello-weather" id="hhWeather">
                <span id="hhWIcon"></span>
                <span id="hhWText">天气加载中</span>
                <span class="hw-city" id="hhWCity">武夷山</span>
            </div>
        </div>

        <div class="input-group">
            <label>学号</label>
            <input type="text" id="username" placeholder="请输入学号" autocomplete="off">
        </div>
        <div class="input-group">
            <label>密码</label>
            <div class="pwd-wrap">
                <input type="password" id="password" placeholder="请输入密码">
                <div class="pwd-dots hidden" id="pwdDots"></div>
                <span id="pwdEye" class="pwd-eye"></span>
            </div>
        </div>
        <div class="checkbox-row">
            <label>
                <input type="checkbox" id="rememberCheckbox" checked>
                <span style="font-size: 14px; color: var(--sub);">记住密码</span>
            </label>
            <label>
                <input type="checkbox" id="autoLoginCheckbox" checked>
                <span style="font-size: 14px; color: var(--sub);">自动登录</span>
            </label>
            <label>
                <input type="checkbox" id="cacheCheckbox" checked>
                <span style="font-size: 14px; color: var(--sub);">课表记忆</span>
            </label>
            <button id="clearCredentialsBtn" class="clear-btn" style="display: none;">清空账号密码</button>
        </div>
        <button id="loginBtn" class="btn">
            <span class="txt">登录教务系统</span>
            <span class="loading hidden"></span>
        </button>
        <div id="loginProgress" class="login-progress hidden">
            <span class="login-progress-text" id="lpText">正在登录教务系统...</span>
        </div>
        <div id="tip" class="tip hidden"></div>
        <!-- 单点提醒详情浮层：点击课表里的提醒直线时显示 -->
        <div id="remindPop" class="hidden"></div>
    </div>

    <div class="card hidden" id="timetable-page">
        <h1>Mimi课表</h1>
        <div id="ttHelloSlot" class="tt-hello-slot"></div>
        <div class="btn-group">
            <button id="todayBtn">今天</button>
            <button id="tomorrowBtn">明天</button>
            <button id="weekBtn">本周</button>
            <button id="customWeekBtn">选周</button>
            <button id="refreshBtn">更新</button>
        </div>
        <div id="ttProgress" class="login-progress hidden" style="margin:0 2px 12px;">
            <span class="login-progress-text" id="ttLpText">正在更新课表...</span>
        </div>
        <div id="courseContent" class="course-list">加载中...</div>
        <button id="logoutBtn" class="btn-secondary">返回主界面</button>
    </div>

    <button id="copyLogBtn" class="copy-log-link">复制运行日志（出问题时点我）</button>
</div>


<div id="cityMask" class="hidden"></div>
<div id="confirmMask" class="confirm-mask hidden">
    <div class="confirm-card">
        <div class="confirm-title">清空账号密码</div>
        <div class="confirm-text">是否清空账号密码？</div>
        <div class="confirm-btns">
            <button id="confirmCancel" class="confirm-btn cancel">取消</button>
            <button id="confirmOk" class="confirm-btn ok">确定</button>
        </div>
    </div>
</div>
<div id="slotTimeMask" class="confirm-mask hidden" onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="confirm-card">
        <div class="confirm-title">节次时间</div>
        <div id="slotTimeList" class="slot-time-list"></div>
        <div class="confirm-btns">
            <button class="confirm-btn ok" onclick="document.getElementById('slotTimeMask').classList.add('hidden')">知道了</button>
        </div>
    </div>
</div>
<div id="courseDetailMask" class="confirm-mask hidden" onclick="if(event.target===this)hideCourseDetail()">
    <div class="confirm-card">
        <div class="confirm-title">课程详情</div>
        <div id="courseDetailList" class="slot-time-list"></div>
        <div class="confirm-btns">
            <button class="confirm-btn ok" onclick="hideCourseDetail()">知道了</button>
        </div>
    </div>
</div>
<div id="scheduleMask" class="sch-mask hidden">
    <div class="sch-dialog">
        <h3>添加日程</h3>
        <div class="sch-field"><label>标题</label><input id="schTitle" type="text" placeholder="如：图书馆自习" autocomplete="off"></div>
        <div class="sch-field"><label>日期</label><input id="schDate" type="date"></div>
        <div class="sch-field"><label>类型</label>
            <div class="sch-mode" id="schMode">
                <button type="button" class="sch-mode-btn on" data-m="range">时间段</button>
                <button type="button" class="sch-mode-btn" data-m="single">单点提醒</button>
            </div>
        </div>
        <div class="sch-row">
            <div class="sch-field"><label id="schStartLabel">开始时间</label><input id="schStart" type="text" readonly inputmode="none" placeholder="08:00"></div>
            <div class="sch-field" id="schEndField"><label>结束时间</label><input id="schEnd" type="text" readonly inputmode="none" placeholder="09:40"></div>
        </div>
        <div class="sch-field"><label>地点（可选）</label><input id="schLoc" type="text" placeholder="如：同文2-404" autocomplete="off"></div>
        <div class="sch-field"><label>备注（可选）</label><input id="schNote" type="text" placeholder="备注" autocomplete="off"></div>
        <div class="sch-field"><label>颜色</label><div class="sch-colors" id="schColors"></div></div>
        <div class="sch-btns">
            <button id="schCancel" class="sch-cancel">取消</button>
            <button id="schSave" class="sch-save">保存</button>
        </div>
    </div>
</div>
<div id="cityPanel" class="hidden">
    <h2>选择城市</h2>
    <input id="cityInput" type="text" placeholder="输入城市名，如：武夷山" autocomplete="off" maxlength="20">
    <div class="city-hint" id="cityHint">默认武夷山，可直接输入其他城市</div>
    <div class="city-btns">
        <button id="cityCancel" class="city-cancel">取消</button>
        <button id="cityOk">确定</button>
    </div>
</div>


<script src="wheel.js"></script>
<script>
    // 页面元素
    const loginPage = document.getElementById('login-page');
    const timetablePage = document.getElementById('timetable-page');

    // ===== 课表页顶部信息条：与主界面共用同一张问候卡 =====
    // 进入课表时把 #hhCard 移入标题下方并默认收起为一条细线框，点击展开成主界面同款；
    // 共用同一节点，时间/名言/天气的定时刷新无需重复同步。
    const hhCard = document.getElementById('hhCard');
    const ttHelloSlot = document.getElementById('ttHelloSlot');
    const hhHomeParent = hhCard ? hhCard.parentNode : null;
    const hhHomeNext = hhCard ? hhCard.nextSibling : null;
    let hhMiniChev = null;
    if (hhCard) {
        hhMiniChev = document.createElement('span');
        hhMiniChev.className = 'hello-mini-chev';
        hhMiniChev.id = 'hhMiniChev';
        hhMiniChev.textContent = '▾';
        hhCard.appendChild(hhMiniChev);
        hhCard.addEventListener('click', function(e) {
            if (!hhCard.classList.contains('tt-mini')) return;
            const t = e.target;
            if (t && t.closest && t.closest('#hhWCity')) return;
            const open = hhCard.classList.toggle('tt-open');
            if (hhMiniChev) hhMiniChev.textContent = open ? '▴' : '▾';
        });
    }
    function mountHelloCard(inTimetable) {
        if (!hhCard || !ttHelloSlot || !hhHomeParent) return;
        if (inTimetable) {
            if (hhCard.parentNode !== ttHelloSlot) ttHelloSlot.appendChild(hhCard);
            hhCard.classList.add('tt-mini');
            hhCard.classList.remove('tt-open');
            if (hhMiniChev) hhMiniChev.textContent = '▾';
        } else {
            if (hhCard.parentNode !== hhHomeParent) {
                const ref = (hhHomeNext && hhHomeNext.parentNode === hhHomeParent) ? hhHomeNext : null;
                hhHomeParent.insertBefore(hhCard, ref);
            }
            hhCard.classList.remove('tt-mini', 'tt-open');
        }
    }
    const tipDiv = document.getElementById('tip');
    const loginBtn = document.getElementById('loginBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberCheckbox = document.getElementById('rememberCheckbox');
    const autoLoginCheckbox = document.getElementById('autoLoginCheckbox');
    const cacheCheckbox = document.getElementById('cacheCheckbox');
    // 恢复记住密码、自动登录、课表记忆偏好（三勾选框状态均持久化）
    try {
        const rm = localStorage.getItem('mimi_remember_pref');
        if (rm !== null) rememberCheckbox.checked = (rm === '1');
        const al = localStorage.getItem('mimi_auto_login');
        if (al !== null) autoLoginCheckbox.checked = (al === '1');
        const cc = localStorage.getItem('mimi_cache_pref');
        if (cc !== null) cacheCheckbox.checked = (cc === '1');
    } catch(e) {}
    // 记住密码＝总开关：未勾选时后两项置灰不可勾选，重新勾选时恢复各自偏好
    function syncMasterSwitch() {
        var on = rememberCheckbox.checked;
        autoLoginCheckbox.disabled = !on;
        cacheCheckbox.disabled = !on;
        if (!on) {
            autoLoginCheckbox.checked = false;
            cacheCheckbox.checked = false;
        } else {
            autoLoginCheckbox.checked = prefOn('mimi_auto_login', autoLoginCheckbox);
            cacheCheckbox.checked = prefOn('mimi_cache_pref', cacheCheckbox);
        }
    }
    rememberCheckbox.addEventListener('change', function() {
        try { localStorage.setItem('mimi_remember_pref', rememberCheckbox.checked ? '1' : '0'); } catch(e) {}
        syncMasterSwitch();
    });
    autoLoginCheckbox.addEventListener('change', function() {
        try { localStorage.setItem('mimi_auto_login', autoLoginCheckbox.checked ? '1' : '0'); } catch(e) {}
    });
    cacheCheckbox.addEventListener('change', function() {
        try { localStorage.setItem('mimi_cache_pref', cacheCheckbox.checked ? '1' : '0'); } catch(e) {}
    });
    // 页面隐藏/关闭时强制保存所有勾选框状态（防止 change 事件未触发）
    function saveAllPrefs() {
        try {
            localStorage.setItem('mimi_remember_pref', rememberCheckbox.checked ? '1' : '0');
            localStorage.setItem('mimi_auto_login', autoLoginCheckbox.checked ? '1' : '0');
            localStorage.setItem('mimi_cache_pref', cacheCheckbox.checked ? '1' : '0');
        } catch(e) {}
    }
    window.addEventListener('pagehide', saveAllPrefs);
    window.addEventListener('visibilitychange', function() { if (document.hidden) saveAllPrefs(); });
    // 统一读取勾选框真实状态：优先 localStorage 持久化值，无值时才用 checkbox 当前状态
    function prefOn(key, checkbox) {
        try { var v = localStorage.getItem(key); if (v !== null) return v === '1'; } catch(e) {}
        return checkbox.checked;
    }
    syncMasterSwitch(); // 初始化时按总开关应用一次联动状态
    const clearCredentialsBtn = document.getElementById('clearCredentialsBtn');
    const todayBtn = document.getElementById('todayBtn');
    const tomorrowBtn = document.getElementById('tomorrowBtn');
    const weekBtn = document.getElementById('weekBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const courseContent = document.getElementById('courseContent');

    let coursesData = [];

    // 辅助函数
    function showTip(msg, isErr = false, duration = 4000) {
        tipDiv.textContent = msg;
        tipDiv.className = 'tip ' + (isErr ? 'err' : 'ok');
        tipDiv.classList.remove('hidden');
        setTimeout(() => {
            if (tipDiv) tipDiv.classList.add('hidden');
        }, duration);
    }

    function setLoginBtnLoading(loading) {
        const txt = loginBtn.querySelector('.txt');
        const spin = loginBtn.querySelector('.loading');
        if (loading) {
            txt.textContent = '登录中...';
            spin.classList.remove('hidden');
            loginBtn.disabled = true;
        } else {
            txt.textContent = '登录教务系统';
            spin.classList.add('hidden');
            loginBtn.disabled = false;
        }
    }

    // ========== 运行日志（界面显示在进度条小字里，复制时带完整版） ==========
    const fullLogLines = [];
    const lpBars = [document.getElementById('loginProgress'), document.getElementById('ttProgress')];
    const lpTexts = [document.getElementById('lpText'), document.getElementById('ttLpText')];
    let lpHideTimer = null;
    let lpLocked = false; // 课表加载成功后锁定，后续日志不再触发进度条显示，避免查完还在转
    var __fromLogout = false; // 标记是否从"返回主界面"进入登录页（true时不自动登录、不加载缓存）
    var __autoLoginFired = false; // 防止一次开屏/返回主界面期间重复触发自动登录
    function pad2(n) { return ('0' + n).slice(-2); }
    // 格式化缓存时间戳为友好文本：今天 14:32 / 昨天 09:10 / 10-19 20:11
    function fmtCacheTime(ts) {
        if (!ts) return '未知';
        var d = new Date(ts), now = new Date();
        var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
        if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate()) return '今天 ' + hm;
        var y = new Date(now.getTime() - 86400000);
        if (d.getFullYear() === y.getFullYear() && d.getMonth() === y.getMonth() && d.getDate() === y.getDate()) return '昨天 ' + hm;
        return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + hm;
    }
    // 读取上次课表缓存时间戳（毫秒），无则返回 0
    function lastCacheTime() {
        try { return parseInt(localStorage.getItem('mimi_last_cache_time') || '0', 10) || 0; } catch(e) { return 0; }
    }
    function nowStamp() {
        const d = new Date();
        return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }
    function showProgress(t) {
        if (lpHideTimer) { clearTimeout(lpHideTimer); lpHideTimer = null; }
        lpBars.forEach(function(el){ if (el) el.classList.remove('idle'); });
        lpTexts.forEach(function(el){ if (el && t) el.textContent = t; });
        lpBars.forEach(function(el){ if (el) el.classList.remove('hidden'); });
    }
    function hideProgress(delay) {
        if (lpHideTimer) clearTimeout(lpHideTimer);
        lpHideTimer = setTimeout(function() {
            lpBars.forEach(function(el){ if (el) el.classList.add('hidden'); });
        }, delay || 0);
    }
    // 待机态：只显示居中文字，不出进度条
    function showIdle(t) {
        if (lpHideTimer) { clearTimeout(lpHideTimer); lpHideTimer = null; }
        lpBars.forEach(function(el){ if (el) el.classList.remove('hidden'); });
        lpTexts.forEach(function(el){ if (el && t) el.textContent = t; });
        if (lpBars[0]) lpBars[0].classList.add('idle');
    }
    // 登录进度：Java 在关键节点调用，文字后面带百分比（0-100）
    window.mimiLoginProgress = function(pct, text) {
        try {
            var p = Math.round(Number(pct) || 0);
            if (p < 0) p = 0;
            if (p > 100) p = 100;
            var t = String(text || '正在登录教务系统…');
            showProgress(t + ' ' + p + '%');
            if (p >= 100) { lpLocked = true; hideProgress(900); }
        } catch(e) {}
    };
    // 内部消息翻译成大白话；返回 null 不显示
    function simplifyTimetableMsg(msg) {
        if (!msg) return null;
        if (msg.indexOf('[page] ') === 0) {
            const u = msg.substring(7);
            if (u.indexOf('sso.') >= 0) return '正在统一身份认证登录...';
            if (u.indexOf('xsMainV_new') >= 0) return '登录成功，正在进入教务系统...';
            if (u.indexOf('xsMainV.htmlx') >= 0) return '已进入教务系统，正在读取课表...';
            return null;
        }
        if (msg.indexOf('[A] ') === 0) {
            const a = msg.substring(4);
            // 请求报文、提交值自检等属于排查证据，只留在可复制的完整日志里，不上屏
            if (a.indexOf('[网络]') >= 0 || a.indexOf('提交值自检') >= 0 || a.indexOf('cookie') >= 0) return null;
            return a;
        }
        if (msg.indexOf('[JS] ') === 0) return msg.substring(4);
        if (msg.indexOf('[页] ') === 0) {
            const p = msg.substring(4);
            if (p.indexOf('课表页已加载') === 0) return null;
            return p;
        }
        return msg;
    }
    window.timetableLog = function(msg) {
        try {
            fullLogLines.push(nowStamp() + ' ' + msg);
            if (lpLocked) return; // 已查完，后续日志只记录不显示进度条
            const s = simplifyTimetableMsg(msg);
            if (s === null) return;
            showProgress(s);
        } catch(e) {}
    };
    document.getElementById('copyLogBtn').onclick = function() {
        const btn = this;
        const text = fullLogLines.join('\n') || '（暂无日志）';
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta);
        const old = btn.textContent;
        btn.textContent = ok ? '已复制，粘贴发给开发者即可' : '复制失败，请长按日志文字复制';
        setTimeout(function() { btn.textContent = old; }, 2000);
    };

    const pwdEye = document.getElementById('pwdEye');
    // 平面UI小眼睛：图标表示「当前状态」——密码隐藏(密文)时显示闭眼斜杠，密码可见(明文)时显示睁眼
    const EYE_OPEN = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.9"/></svg>';

    function getTodayWeekday() {
        const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const today = new Date();
        const weekday = weekdays[today.getDay()];

    function getTomorrowWeekday() {
        const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        return weekdays[tomorrow.getDay()];
    }

    // 解析周次范围：支持 [1-16周] / [3周] / [1-8周,10-16周] / [1-8周][10-16周] / 1-16周(单)
    // 旧实现只取第一个 [] 段，导致「后半学期才上的课」（如第15周）被判为不上课而漏显示
    function parseWeekRanges(wr) {
        if (!wr) return null;
        const s = String(wr);
        const segs = [];
        const re = /(\d{1,2})\s*[-~—－至]\s*(\d{1,2})\s*周\s*[（(]?\s*([单双])?|(\d{1,2})\s*周\s*[（(]?\s*([单双])?/g;
        let m;
        while ((m = re.exec(s)) !== null) {
            let a, b, parity = '';
            if (m[1] != null) {
                a = parseInt(m[1], 10);
                b = parseInt(m[2], 10);
                parity = m[3] || '';
            } else {
                a = b = parseInt(m[4], 10);
                parity = m[5] || '';
            }
            if (isNaN(a) || isNaN(b)) continue;
            segs.push([Math.min(a, b), Math.max(a, b), parity]);
        }
        return segs.length ? segs : null;
    }

    function courseInWeek(c, n) {
        const segs = parseWeekRanges(c.weekRange);
        if (!segs) return true;
        for (const s of segs) {
            if (n < s[0] || n > s[1]) continue;
            if (s[2] === '单' && n % 2 === 0) continue;
            if (s[2] === '双' && n % 2 === 1) continue;
            return true;
        }
        return false;
    }

    const WK_SLOT_ALIAS = { '第一二节': '早八', '第三四节': '早十', '第五六节': '午二', '第七八节': '午四', '第九十节': '晚七', '第十一十二节': '晚九' };

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    // 教务系统回传的上课地点常含重复前缀（如"同文2同文2-404"），去重后返回
    function cleanLoc(s) {
        if (!s) return s;
        let t = String(s).trim();
        for (let pass = 0; pass < 3; pass++) {
            let changed = false;
            const maxK = Math.min(Math.floor(t.length / 2), 12);
            for (let k = maxK; k >= 2; k--) {
                const head = t.slice(0, k);
                if (head === t.slice(k, 2 * k) && /[^\x00-\xff]/.test(head)) {
                    t = t.slice(k);
                    changed = true;
                    break;
                }
            }
            if (!changed) break;
        }
        return t;
    }
    function wkColor(name) {
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
        return WK_COLORS[Math.abs(h) % WK_COLORS.length];
    }
    function hexSoft(hex) {
        const n = parseInt(hex.slice(1), 16);
        return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',0.13)';
    }
    // 中文节次号（如「第九十节」「第九节」）：跳过时间串后取首个节号，兼容两位写法
    const WK_CN_NUM = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10 };
    function slotNoFromText(s) {
        s = String(s || '').replace(/\d{1,2}:\d{2}/g, ' ');
        const m = s.match(/\d+/);
        if (m) {
            const n = parseInt(m[0], 10);
            if (n >= 1 && n <= 12) return n;
        }
        // 中文数字：先匹配「十一」「十二」，避免被「十」截断
        if (s.indexOf('十一') >= 0) return 11;
        if (s.indexOf('十二') >= 0) return 12;
        for (let i = 0; i < s.length; i++) {
            const v = WK_CN_NUM[s.charAt(i)];
            if (v) return v;
        }
        return 0;
    }
    // 小节别名：sections 形如 "03~04小节"，按首节号成对映射为早八/早十/午二/午四/晚七
    function slotAlias(c) {
        const s = String((c && (c.sections || c.timeSlot)) || '');
        const n = slotNoFromText(s);
        if (n) return WK_SLOT_ALIAS[WK_ORDER[Math.floor((n - 1) / 2)]] || '';
        return WK_SLOT_ALIAS[s] || '';
    }
    // 课程所属大节下标（0~4），供「点开别名看时间」定位高亮行
    function slotIndexOf(c) {
        const s = String((c && (c.sections || c.timeSlot)) || '');
        const n = slotNoFromText(s);
        if (n) return Math.floor((n - 1) / 2);
        return WK_ORDER.indexOf(s);
    }
    // 课表格子归属：优先按 sections 首节号，其次按 timeSlot 名称（兼容非数字节次写法）
    function slotIndexOfCourse(c) {

    // 每大节的具体上课起止时间（与教务作息一致）

    // ===== 课程详情弹层：点课程卡片，显示周次范围与上课信息 =====
    let __cardSeq = 0;

    // 周次文案：把「[1-8周][10-16周]」写成「第1-8周、第10-16周」
    function fmtWeekDetail(wr) {

            const t = (s[0] === s[1]) ? ('第' + s[0] + '周') : ('第' + s[0] + '-' + s[1] + '周');

    function daySection(day, list, idx0, dateStr, isCurWeek) {
        const isToday = isCurWeek !== false && day === getTodayWeekday();
        list.sort(function(a, b) { return slotIndexOfCourse(a) - slotIndexOfCourse(b); });
        let html = '<div class="wk-day' + (isToday ? ' today' : '') + '">';
        const schCnt = list.filter(function(c) { return c.__schedule; }).length;
        const cntText = schCnt > 0 ? (list.length - schCnt) + ' 门课 · ' + schCnt + ' 日程' : list.length + ' 门课';

    function wkgDateShort(s) {
        s = String(s || '');
        const m = s.match(/(\d{1,2})\D+(\d{1,2})/);
        if (m) return m[1] + '/' + m[2];
        return s.slice(0, 6);
    }
    // 解析课表里的 dayDate（如 "9月2日" / "9/2"）→ {month, day}
    function parseDayDate(s) {
        s = String(s || '');
        const re = /(\d{1,2})\D+(\d{1,2})/g;
        let m, last = null;
        while ((m = re.exec(s)) !== null) last = m;
        if (!last) return null;
        return { month: parseInt(last[1], 10), day: parseInt(last[2], 10) };
    }
    // 周次锚点：{w: 周次, m: 该周第一天的ISO日期}（第一天可能是周一~周日任意一天）
    let __weekAnchor = null;
    let __week1Locked = false; // 已用课程数据锚定（最高优先级）
    try {
        const _wa = localStorage.getItem('mimi_week_anchor2');
        if (_wa) {
            const o = JSON.parse(_wa);
            if (o && o.w >= 1 && o.w <= 30 && o.m) {
                __weekAnchor = o;
                if (o.locked === true) __week1Locked = true; // 锁定状态随锚点持久化
            }
        }
    } catch(e) {}
    function saveWeekAnchor(n, firstDayIso) {
        // 优先用课程数据推算的第一周第一天，否则退回今天所在周的第一天
        let m = firstDayIso;
        if (!m) {
            const t = new Date();
            const td = t.getDay() === 0 ? 7 : t.getDay();
            const mon = new Date(t.getFullYear(), t.getMonth(), t.getDate() - (td - 1));
            m = mon.getFullYear() + '-' + String(mon.getMonth() + 1).padStart(2, '0') + '-' + String(mon.getDate()).padStart(2, '0');
        }
        __weekAnchor = { w: n, m: m };
        try { localStorage.setItem('mimi_week_anchor2', JSON.stringify(__weekAnchor)); } catch(e) {}
        console.log('周次锚点已设置: 第' + n + '周, 第一天=' + __weekAnchor.m);
    }
    // 双锚定：教务首页当前周次 + 当前周课程表头实际日期 → 反推第1周周一（开学日可为任意星期）
    let __homeWeek = null;   // 教务首页解析到的当前周次
    let __courseRef = null;  // 当前周任一课程的 {dow:星期1-7, t:实际日期ms}
    function isoOf(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function tryLockAnchor() {
        if (__week1Locked || !__homeWeek || !__courseRef) return;
        try {
            const ref = new Date(__courseRef.t);
            // 该课程所在周的周一（dayOfWeek: 1=周一...7=周日）
            const mondayRef = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() - (__courseRef.dow - 1));
            // 反推第1周周一 = 当前周周一 - (当前周次-1)*7天
            const monday1 = new Date(mondayRef.getTime() - (__homeWeek - 1) * 604800000);
            __weekAnchor = { w: 1, m: isoOf(monday1), locked: true };
            __week1Locked = true;
            try { localStorage.setItem('mimi_week_anchor2', JSON.stringify(__weekAnchor)); } catch(e) {}
            timetableLog('[A] 锚点锁定：第1周周一=' + __weekAnchor.m + '（首页第' + __homeWeek + '周+课程日期反推）');
            console.log('第1周周一锚点: ' + __weekAnchor.m);
        } catch(e) { console.log('锚点锁定失败: ' + e.message); }
    }
    function mondayMs(iso) {
        const p = String(iso).split('-');
        return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).getTime();
    }
    // 以锚点推算当前周次：锚点周次 + (本周一 - 锚点周一) 的整周差
    function anchorCurrentWeek() {
        if (!__weekAnchor) return null;
        try {
            const t = new Date();
            const td = t.getDay() === 0 ? 7 : t.getDay();
            const mon = new Date(t.getFullYear(), t.getMonth(), t.getDate() - (td - 1));
            // 锚点日期先归一到其所在周的周一，兼容历史非周一锚点
            const am = new Date(mondayMs(__weekAnchor.m));
            const ad = am.getDay() === 0 ? 7 : am.getDay();
            const amon = new Date(am.getFullYear(), am.getMonth(), am.getDate() - (ad - 1));
            const diff = Math.round((mon.getTime() - amon.getTime()) / 604800000);
            const w = __weekAnchor.w + diff;
            return w >= 1 && w <= 30 ? w : null;
        } catch(e) { return null; }
    }
    // 以锚点推算第 weekNo 周、星期 dayOfWeek 的日期字符串
    function anchorDateFor(weekNo, dayOfWeek) {
        // m 是该周第一天（可能是周一~周日），dayOfWeek 1=周一...7=周日
        // 先求出该周周一，再加 dayOfWeek-1 天
        const first = new Date(mondayMs(__weekAnchor.m));
        const fd = first.getDay() === 0 ? 7 : first.getDay();
        const monday = new Date(first);
        monday.setDate(first.getDate() - (fd - 1)); // 该周周一
        const target = new Date(monday);
        target.setDate(monday.getDate() + (weekNo - __weekAnchor.w) * 7 + (dayOfWeek - 1));
        return (target.getMonth() + 1) + '/' + target.getDate();
    }
    // 从课程数据推算第一周第一天（取所有课程中最早 dayDate，支持任意星期开始）
    let __semStart = null, __semStartChecked = false;
    function getSemesterStart() {
        if (__semStartChecked) return __semStart;
        __semStartChecked = true;
        if (!window.coursesData) return null;
        let best = null;
        const now = new Date();
        const thisYear = now.getFullYear();
        for (let i = 0; i < window.coursesData.length; i++) {
            const p = parseDayDate(window.coursesData[i].dayDate);
            if (!p) continue;
            let cand = null;
            for (let yr of [thisYear, thisYear - 1, thisYear + 1]) {
                const d = new Date(yr, p.month - 1, p.day);

        monday1.setDate(start.getDate() - (sd - 1));
        const target = new Date(monday1);

     * 全屏下按可视区高度计算每节行高：一屏放下 6 节次且不溢出。
     * 行高封顶 76px（对齐教务系统紧凑表格的观感），屏幕较矮时才按可视区压缩。

     */
    function applyFullscreenRowHeight() {
        try {
            const box = document.getElementById('courseContent');
            if (!box) return;
            const cs = getComputedStyle(box);
            const padTop = parseFloat(cs.paddingTop) || 0;
            const padBottom = parseFloat(cs.paddingBottom) || 0;
            const titleEl = box.querySelector('.wk-title');

            const titleMb = titleEl ? (parseFloat(getComputedStyle(titleEl).marginBottom) || 0) : 0;

    // 一条课程记录覆盖的周数（越窄越具体，例如「第1周」比「1-18周」更具体）
    function weekSpanLen(wr) {
        const segs = parseWeekRanges(wr);
        if (!segs) return 99;

        segs.forEach(function(s) { n += Math.abs(s[1] - s[0]) + 1; });
        return n;
    }
    // 单周视图：同一时间格、同一门课只保留一条，避免换教室的多条记录重复渲染（右上角 1/N 叠加）
    function dedupeCellCourses(list) {
        if (list.length <= 1) return list;
        const groups = {}, order = [];
        list.forEach(function(c) {
            // 去掉括号备注后的课程名作为归并键：同门课的不同地点/不同周次视为同一条
            const k = String(c.name || '').replace(/[（(].*?[）)]/g, '').replace(/\s+/g, '');
            if (!groups[k]) { groups[k] = []; order.push(k); }
            groups[k].push(c);
        });
        const out = [];
        order.forEach(function(k) {
            const arr = groups[k];
            if (arr.length === 1) { out.push(arr[0]); return; }
            // 多条时取「周次最具体」的那条：第1周换教室，就显示第1周那间教室
            let best = arr[0];
            for (let i = 1; i < arr.length; i++) {
                if (weekSpanLen(arr[i].weekRange) < weekSpanLen(best.weekRange)) best = arr[i];

            out.push(best);

    // 当前周所属的周次文案（如「[1-4周][5-16周]」在第15周只显示「第5-16周」）
    function activeWeekText(wr, week) {
        if (!week) return wr;
        const segs = parseWeekRanges(wr);
        if (!segs) return wr;
        const hit = segs.filter(function(s) {
            if (week < s[0] || week > s[1]) return false;
            if (s[2] === '单' && week % 2 === 0) return false;
            if (s[2] === '双' && week % 2 === 1) return false;
            return true;
        });
        if (!hit.length) return wr;
        return hit.map(function(s) {
            const t = (s[0] === s[1]) ? ('第' + s[0] + '周') : ('第' + s[0] + '-' + s[1] + '周');
            return s[2] ? (t + '（' + s[2] + '周）') : t;

    // 优先取「包含当前周且周次最具体」的那条，并只显示当前周所属的周次区间。
    function dedupeDayCourses(list, week) {
        const groups = {}, order = [], sches = [];
        list.forEach(function(c) {
            if (c.__schedule) { sches.push(c); return; }
            let k = String(c.name || '').replace(/[（(].*?[）)]/g, '').replace(/\s+/g, '');
            const si = slotIndexOfCourse(c);
            k += '|' + (c.dayOfWeek || '') + '|' + (si >= 0 ? si : String(c.timeSlot || c.sections || ''));
            if (!groups[k]) { groups[k] = []; order.push(k); }

            for (let i = 1; i < arr.length; i++) {

                if (curIn && !bestIn) { best = arr[i]; continue; }
                if (curIn === bestIn && weekSpanLen(arr[i].weekRange) < weekSpanLen(best.weekRange)) best = arr[i];
            }
            if (week && best.weekRange) {

                const copy = {};

                        h += multi ? ('<div class="wkg-pg"' + (i > 0 ? ' style="display:none"' : '') + '>' + page + '</div>') : page;
                    });

                });

                daySch.forEach(function(ds) {
                    if (!ds.isSingle || ds.si !== ri) return;
                    const m = String(ds.s.start || '08:00').match(/(\d{1,2}):(\d{2})/);
                    const mins = m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : 480;
                    const a = SCH_SLOT_STARTS[ri];
                    const b = (ri + 1 < SCH_SLOT_STARTS.length) ? SCH_SLOT_STARTS[ri + 1] : a + 120;
                    const ratio = Math.max(0.08, Math.min(0.92, (mins - a) / (b - a)));

                    h += '<div class="wkg-line" style="top:' + (ratio * 100).toFixed(1) + '%;--wk-accent:' + sc + '"'

                        + ' title="' + esc(ds.s.title || '提醒') + '"></div>';
                });
                h += '</div>';

    // 同格多项的翻页卡片：点击切换到下一张，循环展示
    function closestPager(el) {
        while (el && el !== document.body) {
            if (el.classList && el.classList.contains('wkg-pager')) return el;
            el = el.parentNode;
        }
        return null;
    }
    function pagerGoNext(pager) {
        const pgs = pager.querySelectorAll('.wkg-pg');
        if (pgs.length < 2) return;
        let idx = parseInt(pager.getAttribute('data-pg') || '0', 10);
        idx = (idx + 1) % pgs.length;
        pager.setAttribute('data-pg', String(idx));
        for (let i = 0; i < pgs.length; i++) pgs[i].style.display = i === idx ? '' : 'none';
        const badge = pager.querySelector('.wkg-badge');
        if (badge) badge.textContent = (idx + 1) + '/' + pgs.length;
    }
    // 单点提醒详情浮层：显示标题/时间/地点/备注，点击其它地方关闭
    function showRemindPop(s, anchor) {
        const pop = document.getElementById('remindPop');
        if (!pop) return;
        pop.innerHTML = '<div class="rp-title">' + esc(s.title || '提醒') + '</div>'
            + '<div class="rp-row">🕐 <b>' + esc(s.start || '') + '</b>' + (s.date ? ' · ' + esc(s.date) : '') + '</div>'
            + (s.location ? '<div class="rp-row">📍 ' + esc(s.location) + '</div>' : '')
            + (s.note ? '<div class="rp-row">📝 ' + esc(s.note) + '</div>' : '');
        pop.classList.remove('hidden');
        const r = anchor.getBoundingClientRect();
        requestAnimationFrame(function() {
            const w = pop.offsetWidth || 200, h = pop.offsetHeight || 80;
            const left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
            let top = r.bottom + 6;
            if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';
        });
    }

        pop.classList.add('hidden');
    }, true);

    courseContent.addEventListener('click', function(e) {

        // 单周网格与列表卡不挂 data-cid，因此不会触发详情；此处仍放在翻页判断之前，
        // 避免同格多课时点击被 pagerGoNext 吞掉。
        const card = e.target.closest('.wkg-course[data-cid]');
        if (card) {
            const cid = parseInt(card.getAttribute('data-cid'), 10);
            if (cid > 0) showCourseDetail(cid);
            return;
        }
        // 单点提醒直线：点击弹出对应待办事项
        const line = e.target.closest('.wkg-line');
        if (line) {
            const rid = line.getAttribute('data-rid');
            const s = (window.schedulesData || []).find(function(x) { return String(x.id) === String(rid); });
            if (s) showRemindPop(s, line);
            return;
        }
        // 翻页角标：点击切换当前格内显示哪张日程卡（同时重置展开状态）
        const badge = e.target.closest('.wkg-badge');
        if (badge) {
            const pager = badge.closest('.wkg-pager');
            if (pager) {
                pager.classList.remove('sch-active');
                pager.querySelectorAll('.sch-active').forEach(function(c) { c.classList.remove('sch-active'); });
                pagerGoNext(pager);
                e.stopPropagation();
            }
            return;
        }
        // 跨格日程框：点中间在「外框（透出课程）」与「展开卡片（盖住课程）」之间切换
        const spanBox = e.target.closest('.wkg-span');

            const opening = !spanBox.classList.contains('sch-active');
            document.querySelectorAll('.wkg-cell.z-top').forEach(function(c) { c.classList.remove('z-top'); });

            if (opening) {
                const cell = spanBox.closest('.wkg-cell');
                if (cell) cell.classList.add('z-top');
            }
            return;
        }
        const pager = closestPager(e.target);
        if (!pager) return;
        pagerGoNext(pager);
