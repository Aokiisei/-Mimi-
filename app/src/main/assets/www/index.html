        ['有志者，事竟成','《后汉书》'],['绳锯木断，水滴石穿','罗大经'],['锲而不舍，金石可镂','荀子'],
        ['读书破万卷，下笔如有神','杜甫'],['问渠那得清如许，为有源头活水来','朱熹'],
        ['博观而约取，厚积而薄发','苏轼'],['士不可以不弘毅，任重而道远','《论语》'],
        ['千里之行，始于足下','老子'],['天行健，君子以自强不息','《周易》'],
        ['穷且益坚，不坠青云之志','王勃'],['老骥伏枥，志在千里','曹操'],
        ['非淡泊无以明志，非宁静无以致远','诸葛亮'],['千淘万漉虽辛苦，吹尽狂沙始到金','刘禹锡'],
        ['咬定青山不放松，立根原在破岩中','郑燮'],['少壮不努力，老大徒伤悲','《长歌行》'],
        ['花有重开日，人无再少年','《窦娥冤》'],['明日复明日，明日何其多','《明日歌》'],
        ['莫愁前路无知己，天下谁人不识君','高适'],['大鹏一日同风起，扶摇直上九万里','李白'],
        ['精诚所至，金石为开','《后汉书》'],['读万卷书，行万里路','刘彝'],
        ['世上无难事，只怕有心人','《西游记》'],['不飞则已，一飞冲天；不鸣则已，一鸣惊人','《史记》']
    ];
    const HH_DEFAULT_CITY = '武夷山';
    let hhLastWx = 0;
    let hhCityBusy = false;

    function hhPad(n) { return ('0' + n).slice(-2); }
    function hhEsc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function hhGreet(h) {
        if (h < 5) return '夜深了，早点休息';
        if (h < 9) return '早上好';
        if (h < 12) return '上午好';
        if (h < 14) return '中午好';
        if (h < 18) return '下午好';
        if (h < 23) return '晚上好';
        return '夜深了，早点休息';
    }
    function hhTick() {
        const now = new Date();
        const t = hhPad(now.getHours()) + ':' + hhPad(now.getMinutes());
        const sec = ':' + hhPad(now.getSeconds());
        const timeEl = document.getElementById('hhTime');
        const greetEl = document.getElementById('hhGreet');
        const dateEl = document.getElementById('hhDate');
        if (timeEl) {
            // 秒数用小一号字显示，避免主时间过于笨重
            if (timeEl.dataset.head !== t) {
                timeEl.innerHTML = t + '<span class="hh-sec"></span>';
                timeEl.dataset.head = t;
            }
            const secEl = timeEl.querySelector('.hh-sec');
            if (secEl && secEl.textContent !== sec) secEl.textContent = sec;
        }
        if (greetEl) greetEl.textContent = hhGreet(now.getHours());
        if (dateEl) dateEl.textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日 · 星期' + '日一二三四五六'[now.getDay()];
        if (Date.now() - hhLastWx > 30 * 60 * 1000) loadWeather();
        if (Date.now() - hhLastQuoteTry > 60 * 1000) fetchQuote(); // 语录每 1 分钟自动换一句
    }
    let hhLastQuote = 0, hhLastQuoteTry = 0; // 上次成功拉取/尝试拉取一言的时间戳
    function hhQuoteOfDay() {
        const now = new Date();
        const seed = now.getFullYear() * 400 + (now.getMonth() + 1) * 40 + now.getDate();
        return HH_QUOTES[seed % HH_QUOTES.length];
    }
    function renderQuote(q) {
        const el = document.getElementById('hhQuote');
        if (el) el.innerHTML = '「' + hhEsc(q[0]) + '」<span class="q-src">—— ' + hhEsc(q[1] || '佚名') + '</span>';
    }
    // 语录刷新策略：先显示内置每日句，再联网拉一言覆盖；之后每 1 分钟自动换一句
    function fetchQuote() {
        hhLastQuoteTry = Date.now();
        try {
            const x = new XMLHttpRequest();
            x.timeout = 8000;
            x.onreadystatechange = function() {
                if (x.readyState === 4 && x.status === 200) {
                    try {
                        const d = JSON.parse(x.responseText);
                        if (d && d.hitokoto) {
                            renderQuote([d.hitokoto, d.from || '一言']);
                            hhLastQuote = Date.now();
                        }
                    } catch (e) {}
                }
            };
            x.open('GET', 'https://v1.hitokoto.cn/?c=d&c=i&c=k&encode=json', true);
            x.send();
        } catch (e) {}
    }
    function loadQuote() {
        renderQuote(hhQuoteOfDay());
        fetchQuote();
    }
    function hhXhrJson(url, ok, fail) {
        try {
            const x = new XMLHttpRequest();
            x.timeout = 9000;
            x.onreadystatechange = function() {
                if (x.readyState === 4) {
                    if (x.status === 200) {
                        try { ok(JSON.parse(x.responseText)); return; } catch (e) {}
                    }
                    fail && fail();
                }
            };
            x.open('GET', url, true);
            x.send();
        } catch (e) { fail && fail(); }
    }
    // 是否需要带伞：毛毛雨/雨/冻雨/阵雨/雷雨都提示，雪天不带伞
    function hhNeedUmbrella(code) {
        code = Number(code);
        return (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (code >= 95 && code <= 99);
    }
    function renderWeather(d) {
        const iconEl = document.getElementById('hhWIcon');
        const textEl = document.getElementById('hhWText');
        const cityEl = document.getElementById('hhWCity');
        if (!textEl) return;
        if (d.fail) {
            if (iconEl) iconEl.innerHTML = HH_ICONS.cloud;
            textEl.textContent = '暂时无法获取天气';
        } else {
            if (iconEl) iconEl.innerHTML = HH_ICONS[d.icon] || HH_ICONS.cloud;
            textEl.textContent = d.temp + '°C · ' + d.desc + (d.rain ? ' · 记得带伞' : '');
            textEl.title = d.rain ? '今天有降水，出门记得带伞' : '今天没有降水，无需带伞';
        }
        if (cityEl) cityEl.textContent = d.city;
    }
    function fetchWx(lat, lon, city, cityKey) {
        hhXhrJson('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,weather_code&timezone=auto', function(w) {
            const cur = w.current || {};
            const info = HH_CODES[cur.weather_code] || ['', 'cloud'];
            const data = { city: city, cityKey: cityKey || city, temp: Math.round(cur.temperature_2m), desc: info[0], icon: info[1], code: cur.weather_code, rain: hhNeedUmbrella(cur.weather_code), t: Date.now() };
            try { localStorage.setItem('mimi_weather', JSON.stringify(data)); } catch (e) {}
            renderWeather(data);
        }, function() { renderWeather({ fail: true, city: city }); });
    }
    function loadWeather() {
        hhLastWx = Date.now();
        let city = HH_DEFAULT_CITY;
        try { city = localStorage.getItem('mimi_city') || HH_DEFAULT_CITY; } catch (e) {}
        try {
            const cache = JSON.parse(localStorage.getItem('mimi_weather') || 'null');
            if (cache && cache.cityKey === city && Date.now() - cache.t < 30 * 60 * 1000) {
                renderWeather(cache); return;
            }
        } catch (e) {}
        hhGeocode(city, function(r) {
            fetchWx(r.latitude, r.longitude, r.name || city, city);
        }, function() {
            renderWeather({ fail: true, city: city });
        });
    }
    // 城市名合法性：2~20 个中文/英文字符（允许「·」「-」与空格，如「呼和浩特」「Xi'an」）
    function hhCityNameValid(name) {
        return name.length >= 2 && name.length <= 20 && /^[\u4e00-\u9fa5A-Za-z·\- ]+$/.test(name);
    }
    function hhGeocode(city, ok, fail) {
        hhXhrJson('https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&name=' + encodeURIComponent(city), function(g) {
            if (!g.results || !g.results.length) { fail && fail(); return; }
            ok(g.results[0]);
        }, fail);
    }
    function hhCityHint(msg, isErr) {
        const el = document.getElementById('cityHint');
        if (!el) return;
        el.textContent = msg || '';
        if (isErr) el.classList.add('err');
        else el.classList.remove('err');
    }
    function openCityPanel() {
        hhCityBusy = false;
        let cur = HH_DEFAULT_CITY;
        try { cur = localStorage.getItem('mimi_city') || HH_DEFAULT_CITY; } catch (e) {}
        const input = document.getElementById('cityInput');
        if (input) {
            input.value = cur;
            input.classList.remove('err');
        }
        hhCityHint('可直接输入城市名，默认' + HH_DEFAULT_CITY, false);
        const okBtn = document.getElementById('cityOk');
        if (okBtn) okBtn.disabled = false;
        const mask = document.getElementById('cityMask');
        const panel = document.getElementById('cityPanel');
        if (mask) mask.classList.remove('hidden');
        if (panel) panel.classList.remove('hidden');
        if (input) input.focus();
    }
    function closeCityPanel() {
        hhCityBusy = false;
        const mask = document.getElementById('cityMask');
        const panel = document.getElementById('cityPanel');
        if (mask) mask.classList.add('hidden');
        if (panel) panel.classList.add('hidden');
    }
    // 输入城市 → 校验合规 → 解析坐标 → 保存并刷新天气；校验或查询失败时提示且不关闭弹窗
    function submitCity() {
        if (hhCityBusy) return;
        const input = document.getElementById('cityInput');
        const name = (input ? input.value : '').replace(/\s+/g, ' ').trim();
        if (!name) { hhCityHint('请输入城市名', true); if (input) input.focus(); return; }
        if (!hhCityNameValid(name)) { hhCityHint('城市名不合法，请输入 2~20 位中文或英文城市名', true); if (input) input.focus(); return; }
        hhCityBusy = true;
        hhCityHint('正在获取天气…', false);
        const okBtn = document.getElementById('cityOk');
        if (okBtn) okBtn.disabled = true;
        hhGeocode(name, function(r) {
            hhCityBusy = false;
            if (okBtn) okBtn.disabled = false;
            try {
                localStorage.setItem('mimi_city', name);
                localStorage.removeItem('mimi_weather');
            } catch (e) {}
            closeCityPanel();
            hhLastWx = Date.now();
            fetchWx(r.latitude, r.longitude, r.name || name, name);
        }, function() {
            hhCityBusy = false;
            if (okBtn) okBtn.disabled = false;
            hhCityHint('未找到该城市，请检查城市名后重试', true);
            if (input) input.focus();
        });
    }
    function initHello() {
        // 天气城市：收起（tt-mini）时不可点；展开成完整大卡后才能点击换城市
        const cityEl = document.getElementById('hhWCity');
        const wx = document.getElementById('hhWeather');
        const card = document.getElementById('hhCard');
        const isExpanded = function() {
            return card && (!card.classList.contains('tt-mini') || card.classList.contains('tt-open'));
        };
        if (cityEl) {
            cityEl.onclick = function() { if (isExpanded()) openCityPanel(); };
        }
        if (wx) {
            wx.onclick = function() { if (isExpanded()) openCityPanel(); };
        }
        const mask = document.getElementById('cityMask');
        if (mask) mask.onclick = closeCityPanel;
        const cancel = document.getElementById('cityCancel');
        if (cancel) cancel.onclick = closeCityPanel;
        const ok = document.getElementById('cityOk');
        if (ok) ok.onclick = submitCity;
        const input = document.getElementById('cityInput');
        if (input) {
            input.onkeydown = function(ev) { if (ev.key === 'Enter') { ev.preventDefault(); submitCity(); } };
            input.oninput = function() { if (!hhCityBusy) hhCityHint('可直接输入城市名，默认' + HH_DEFAULT_CITY, false); };
        }
        hhTick();
        setInterval(hhTick, 1000);
        loadQuote();
    }
    initHello();
    </script>
