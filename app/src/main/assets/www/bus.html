<html lang="zh-CN">

<meta charset="utf-8">

<title>武夷实时公交</title>
<style>
        @font-face {
            font-family: 'Mi Serif';
            src: url('../fonts/mi-serif.otf') format('opentype');
            font-display: block;
        }
        :root {
            --primary: #C96442; --bg: #F5F4ED; --card: #FAF9F5; --ink: #141413;
            --sub: #87867F; --border: #E8E6DC; --accent: #D97757; --soft: #FDF1EC;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; background: transparent; }
        body {
            font-family: "Mi Serif", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif;
            -webkit-text-stroke: 0.32px currentColor;
            color: var(--ink);
        }
        .sheet {
            height: calc(100% - 16px); margin: 8px; overflow-y: auto;
            display: flex; flex-direction: column;
            background: var(--card); border-radius: 18px;
            box-shadow: 0 0 0 1px rgba(201,100,66,0.14), 0 12px 40px rgba(20,20,19,0.20), inset 0 1px 0 rgba(255,255,255,0.7);
        }
        .head { display: flex; align-items: flex-start; padding: 16px 16px 0; }
        .head-txt { min-width: 0; }
        .title { font-size: 18px; font-weight: 500; letter-spacing: .2px; }
        .sub { margin-top: 4px; font-size: 11.5px; color: var(--sub); }
        .close {
            flex: 0 0 auto; margin-left: auto; width: 28px; height: 28px; border-radius: 50%;
            border: 1px solid var(--border); background: #FFFFFF; color: var(--sub);
            font-size: 15px; line-height: 26px; text-align: center; padding: 0;
            font-family: inherit;
        }
        .search { display: flex; align-items: center; gap: 7px; padding: 12px 16px 0; }
        .search input {
            flex: 1; min-width: 0; height: 36px; padding: 0 10px;
            border: 1px solid var(--border); border-radius: 9px; background: #FFFFFF;
            font-family: inherit; font-size: 13px; color: var(--ink);
            -webkit-text-stroke: 0.32px currentColor;
        }
        .search input::placeholder { color: #B4B1A8; }
        .sep { flex: 0 0 auto; font-size: 13px; color: var(--sub); }
        .hint { padding: 7px 18px 0; font-size: 11px; color: var(--sub); min-height: 16px; }
        .hint.warn { color: #B4553A; }
        .tabs {
            display: flex; gap: 7px; padding: 6px 16px 0;
            overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { height: 0; display: none; }
        .tab {
            flex: 0 0 auto; height: 32px; padding: 0 14px; border-radius: 9px;
            border: 1px solid var(--border); background: #FFFFFF; color: var(--sub);
            font-family: inherit; font-size: 12.5px;
            transition: background .18s ease, color .18s ease, border-color .18s ease;
        }
        .tab.on {
            background: var(--soft); border-color: rgba(201,100,66,0.42); color: var(--primary);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .route { display: none; flex-direction: column; min-height: 0; }
        .route.on { display: flex; }
        .times {
            display: flex; align-items: center; gap: 16px; padding: 11px 18px 0;
            font-size: 12px; color: var(--sub);
        }
        .times b { color: var(--ink); font-weight: 500; }
        .times .actions { margin-left: auto; display: flex; gap: 6px; }
        .tt-btn {
            height: 24px; padding: 0 10px; border-radius: 7px;
            border: 1px solid var(--border); background: #FFFFFF; color: var(--sub);
            font-family: inherit; font-size: 11px;
        }
        .tt { display: none; padding: 8px 16px 0; }
        .tt.on { display: block; }
        .dirs { display: flex; flex-wrap: wrap; gap: 6px; }
        .dir {
            height: 26px; padding: 0 9px; border-radius: 7px; border: 1px solid var(--border);
            background: #FFFFFF; color: var(--sub); font-family: inherit; font-size: 11px;
        }
        .dir.on { background: var(--soft); border-color: rgba(201,100,66,0.42); color: var(--primary); }
        .tt-note { padding: 7px 0 0; font-size: 10.5px; color: var(--sub); line-height: 1.45; }
        .period { padding: 9px 0 0; }
        .period .plabel { font-size: 11px; color: var(--sub); }
        .period .ptimes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .period .ptimes span {
            min-width: 43px; height: 22px; line-height: 22px; text-align: center;
            border-radius: 6px; background: #FFFFFF; border: 1px solid var(--border);
            font-size: 11.5px; color: var(--ink);
        }
        .pnote { margin-top: 5px; font-size: 10.5px; color: var(--sub); }
        .scroller { overflow-x: auto; overflow-y: hidden; padding: 10px 0 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .scroller::-webkit-scrollbar { height: 0; display: none; }
        .rail { position: relative; display: flex; width: max-content; --pad: 34px; padding: 0 var(--pad); }
        .rail::before {
            content: ''; position: absolute; left: calc(var(--pad) + 28px); right: calc(var(--pad) + 28px); top: 9px;
            height: 2px; background: var(--border); border-radius: 1px;
        }
        .seg-line {
            position: absolute; top: 9px; height: 2px; background: var(--primary);
            border-radius: 1px; z-index: 0;
        }
        .arrow {
            position: absolute; top: 4px; width: 0; height: 0;
            border-top: 6px solid transparent; border-bottom: 6px solid transparent;
        }
        .arrow.l { left: calc(var(--pad) - 10px); border-right: 8px solid var(--primary); }
        .arrow.r { right: calc(var(--pad) - 10px); border-left: 8px solid var(--primary); }
        .stop { flex: 0 0 56px; width: 56px; display: flex; flex-direction: column; align-items: center; }
        .dot {
            width: 9px; height: 9px; border-radius: 50%; margin-top: 5px;
            background: #FFFFFF; border: 2px solid var(--primary); position: relative; z-index: 1;
        }
        .stop.start .dot, .stop.end .dot { background: var(--primary); }
        .name {
            margin-top: 9px; writing-mode: vertical-rl; text-orientation: upright;
            font-size: 12px; line-height: 1.28; letter-spacing: .5px;
            white-space: nowrap; color: var(--ink);
        }
        .stop.start .name, .stop.end .name { color: var(--ink); }
        .stop.seg .dot { background: var(--primary); border-color: var(--primary); }
        .stop.seg .name { color: var(--primary); }
        .stop.seg.from-pt .dot, .stop.seg.to-pt .dot { box-shadow: 0 0 0 4px rgba(201,100,66,0.18); }
        .stop.seg.from-pt .name, .stop.seg.to-pt .name { font-weight: 500; }
        .foot { margin-top: auto; padding: 10px 16px 13px; font-size: 11px; color: var(--sub); }
        /* ===== 实时公交面板 ===== */
        .live-panel { display: none; flex-direction: column; padding: 10px 16px 14px; border-top: 1px dashed var(--border); }
        .live-panel.on { display: flex; }
        .live-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .live-route { font-size: 14px; font-weight: 500; color: var(--ink); }
        .live-dir-group { display: flex; gap: 6px; margin-left: auto; }
        .live-dir { height: 24px; padding: 0 9px; border-radius: 7px; border: 1px solid var(--border); background: #FFFFFF; color: var(--sub); font-family: inherit; font-size: 11px; white-space: nowrap; }
        .live-dir.on { background: var(--soft); border-color: rgba(201,100,66,0.42); color: var(--primary); }
        .live-meta { display: flex; gap: 10px; font-size: 11px; color: var(--sub); margin-bottom: 8px; }
        .live-meta b { color: var(--ink); font-weight: 500; }
        .live-meta .live-state-warn { color: #B4553A; font-weight: 500; }
        .live-list { font-size: 12.5px; color: var(--ink); }
        .live-list-row { display: flex; align-items: flex-start; gap: 8px; padding: 7px 2px; border-bottom: 1px dashed var(--border); }
        .live-list-row:last-child { border-bottom: none; }
        .live-station-num { flex: 0 0 22px; font-size: 10.5px; color: var(--sub); text-align: right; padding-top: 1px; font-variant-numeric: tabular-nums; }
        .live-station-name { flex: 1 1 auto; min-width: 0; }
        .live-station-name .ln { color: var(--ink); font-weight: 500; }
        .live-station-name .lst { font-size: 11px; color: var(--sub); margin-left: 4px; }
        .live-buses { flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; min-width: 110px; }
        .live-bus { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--soft); color: var(--primary); border: 1px solid rgba(201,100,66,0.3); line-height: 1.5; text-align: right; }
        .live-bus .lb-plate { font-weight: 500; font-size: 11px; }
        .live-bus .lb-sub { color: var(--sub); font-size: 10px; margin-left: 3px; }
        .live-empty { padding: 20px 0; text-align: center; color: var(--sub); font-size: 12px; }
        .live-empty.warn { color: #B4553A; }
        .live-loader { padding: 14px 0; text-align: center; color: var(--sub); font-size: 12px; }
</style>
</head>

    function stopsOf(no) { return railOf(no).querySelectorAll('.stop'); }

    function buildTabs() {
        document.getElementById('tabs').innerHTML = ORDER.map(function (no) {
            return '<button class="tab' + (no === current ? ' on' : '') + '" data-no="' + no +
                '" onclick="switchRoute(' + no + ')">' + no + ' 路</button>';
        }).join('');
    }

    function buildRoutes() {
        document.getElementById('routes').innerHTML = ORDER.map(function (no) {
            const r = ROUTES[no];
            const stops = r.stops.map(function (name, i) {
                const cls = i === 0 ? 'stop start' : (i === r.stops.length - 1 ? 'stop end' : 'stop');
                return '<div class="' + cls + '" data-name="' + esc(name) + '"><div class="dot"></div>' +
                    '<div class="name">' + esc(name) + '</div></div>';
            }).join('');
            const ttBtn = r.dirs
                ? '<button class="tt-btn" onclick="toggleTimetable(' + no + ')">时刻表 ▾</button>'
                : '';
            const liveBtn = LIVE_ROUTES[String(no)]
                ? '<button class="tt-btn" onclick="toggleLive(' + no + ')">实时 ▾</button>'
                : '';
            const hasBtns = ttBtn || liveBtn;
            const actions = hasBtns ? '<span class="actions">' + ttBtn + liveBtn + '</span>' : '';
            const tt = r.dirs
                ? '<div class="tt" id="tt' + no + '">' +
                    '<div class="dirs">' + r.dirs.map(function (d, i) {
                        return '<button class="dir' + (i === 0 ? ' on' : '') + '" data-dir="' + i +
                            '" onclick="showDir(' + no + ',' + i + ')">' + esc(d.name) + '</button>';
                    }).join('') + '</div>' +
                    '<div class="tt-body" id="ttbody' + no + '"></div>' +
                  '</div>'
                : '';
            return '<div class="route' + (no === current ? ' on' : '') + '" id="route' + no + '">' +
                '<div class="times"><span>首班 <b class="t-first">' + r.start + '</b></span>' +
                '<span>末班 <b class="t-last">' + r.end + '</b></span>' + actions + '</div>' +
                '<div class="scroller"><div class="rail"><div class="arrow l"></div>' + stops +
                '<div class="arrow r"></div></div></div>' + tt +
                (LIVE_ROUTES[String(no)] ? '<div class="live-panel" id="live' + no + '"></div>' : '') +
                '</div>';
        }).join('');
        ORDER.forEach(function (no) {
            if (ROUTES[no].dirs) showDir(no, 0, true);
        });
    }

    // 时刻表面积：按方向切换，方向内按早晚高峰分段
    function showDir(no, dir, silent) {
        const r = ROUTES[no];
        if (!r.dirs || !r.dirs[dir]) return;
        const d = r.dirs[dir];
        document.querySelectorAll('#route' + no + ' .dir').forEach(function (el) {
            el.classList.toggle('on', Number(el.dataset.dir) === dir);
        });
        const route = document.getElementById('route' + no);
        route.querySelector('.t-first').textContent = d.first;
        route.querySelector('.t-last').textContent = d.last;
        document.getElementById('ttbody' + no).innerHTML =
            (r.fare || r.remark
                ? '<div class="tt-note">' + esc([r.fare, r.remark].filter(Boolean).join(' · ')) + '</div>'
                : '') +
            d.periods.map(function (p) {
                const body = p.note
                    ? '<div class="pnote">' + esc(p.note) + '</div>'
                    : '<div class="ptimes">' + p.times.map(function (t) {
                        return '<span>' + t + '</span>';
                    }).join('') + '</div>';
                return '<div class="period"><div class="plabel">' + esc(p.label) + '</div>' + body + '</div>';
            }).join('');
        if (!silent) route.querySelector('.times').scrollIntoView({ block: 'nearest' });
    }

    function toggleTimetable(no) {
        const tt = document.getElementById('tt' + no);
        const open = tt.classList.toggle('on');
        const btn = document.querySelector('#route' + no + ' .tt-btn');
        if (btn) btn.textContent = open ? '时刻表 ▴' : '时刻表 ▾';
        if (open) tt.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        touched = true;
    }

    function setHint(text, warn) {
        const el = document.getElementById('hint');
        el.textContent = text;
        el.classList.toggle('warn', !!warn);
    }

    function clearSeg(no) {
        stopsOf(no).forEach(function (el) { el.classList.remove('seg', 'from-pt', 'to-pt'); });
        const line = railOf(no).querySelector('.seg-line');
        if (line) line.remove();
    }

    function ensurePad(no) {
        const scroller = scrollerOf(no);
        const pad = Math.max(34, Math.round(scroller.clientWidth / 2 - 28));
        railOf(no).style.setProperty('--pad', pad + 'px');
        railOf(no).getBoundingClientRect();
        return scroller;
    }

    function centerIndex(no, index, smooth) {
        const scroller = ensurePad(no);
        const stop = stopsOf(no)[index];
        stop.getBoundingClientRect();
        const left = Math.round(stop.offsetLeft + stop.offsetWidth / 2 - scroller.clientWidth / 2);
        if (smooth) scroller.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
        else scroller.scrollLeft = Math.max(0, left);
        return stop;
    }

    function centerRange(no, lo, hi, smooth) {
        const scroller = ensurePad(no);
        const stops = stopsOf(no);
        const span = stops[hi].offsetLeft - stops[lo].offsetLeft;
        // 区间比屏幕还宽时无法一眼看完，先把起点居中，终点由用户右滑查看
        const mid = span > scroller.clientWidth - 60
            ? stops[lo].offsetLeft + 28
            : (stops[lo].offsetLeft + stops[hi].offsetLeft) / 2 + 28;
        scroller.scrollTo({ left: Math.max(0, Math.round(mid - scroller.clientWidth / 2)), behavior: smooth ? 'smooth' : 'auto' });
    }

    function drawSegment(no, lo, hi) {
        clearSeg(no);
        const rail = railOf(no);
        const stops = stopsOf(no);
        const a = stops[lo], b = stops[hi];
        for (let i = lo; i <= hi; i++) stops[i].classList.add('seg');
        stops[lo].classList.add('from-pt');
        stops[hi].classList.add('to-pt');
        const line = document.createElement('div');
        line.className = 'seg-line';
        line.style.left = (a.offsetLeft + a.offsetWidth / 2) + 'px';
        line.style.width = Math.max(0, b.offsetLeft - a.offsetLeft) + 'px';
        rail.insertBefore(line, rail.firstChild.nextSibling);
        return { total: hi - lo + 1, middle: Math.max(0, hi - lo - 1) };
    }

    // 在当前线路中查找站点，找不到则返回 -1
    function findOn(no, q) {
        const stops = ROUTES[no].stops;
        let exact = -1, prefix = -1, contains = -1;
        stops.forEach(function (n, i) {
            if (n === q && exact < 0) exact = i;
            else if (n.indexOf(q) === 0 && prefix < 0) prefix = i;
            else if (n.indexOf(q) > 0 && contains < 0) contains = i;
        });
        return exact >= 0 ? exact : (prefix >= 0 ? prefix : contains);
    }

    // 输入某个站点：优先当前线路，找不到就切到有这条站的线路
    function resolveStop(q) {
        const order = [current].concat(ORDER.filter(function (n) { return n !== current; }));
        for (let k = 0; k < order.length; k++) {
            const idx = findOn(order[k], q);
            if (idx >= 0) return { route: order[k], index: idx };
        }
        return null;
    }

    function refreshSegment(keepInput) {
        const fromRaw = document.getElementById('from').value.replace(/\s/g, '');
        const toRaw = document.getElementById('to').value.replace(/\s/g, '');
        clearSeg(current);
        if (!fromRaw && !toRaw) {
            setHint('输入起点与终点，可标出区间', false);
            return;
        }
        if (!fromRaw || !toRaw) {
            setHint(fromRaw ? '再输入终点站即可标出区间' : '再输入起点站即可标出区间', false);
            return;
        }
        const a = resolveStop(fromRaw), b = resolveStop(toRaw);
        if (!a || !b) {
            const bad = !a ? fromRaw : toRaw;
            setHint('未找到「' + bad + '」，试试其他关键词', true);
            return;
        }
        if (a.route !== b.route) {
            setHint('「' + fromRaw + '」和「' + toRaw + '」不在同一条线路上', true);
            return;
        }
        if (a.route !== current) switchRoute(a.route, true);
        const lo = Math.min(a.index, b.index), hi = Math.max(a.index, b.index);
        ensurePad(current);                 // 先确定两端留白，再按最终位置画区间
        const info = drawSegment(current, lo, hi);
        centerRange(current, lo, hi, true);
        setHint(current + ' 路 · ' + fromRaw + ' → ' + toRaw + ' 共 ' + info.total +
            ' 站，途经 ' + info.middle + ' 站', false);
    }

    function switchRoute(no, keepInput) {
        current = no;
        touched = true;
        ORDER.forEach(function (n) {
            document.getElementById('route' + n).classList.toggle('on', n === no);
            const tab = document.querySelector('.tab[data-no="' + n + '"]');
            if (tab) tab.classList.toggle('on', n === no);
        });
        clearSeg(no);
        railOf(no).style.setProperty('--pad', '34px');
        scrollerOf(no).scrollLeft = 0;
        if (!keepInput) {
            document.getElementById('from').value = '';
            document.getElementById('to').value = '';
            setHint('输入起点与终点，可标出区间', false);
        }
    }

    function initDefault() {
        const idx = ROUTES[current].stops.indexOf(DEFAULT_STOP);
        if (idx < 0) return;
        const stop = centerIndex(current, idx, false);
        stop.classList.add('seg');
        setHint('当前显示 ' + current + ' 路 · ' + DEFAULT_STOP + '（已居中）', false);
    }

    function closeSheet() {
        stopLivePoll();
        if (window.MimiBridge && window.MimiBridge.close) {
            window.MimiBridge.close();
        }
    }

    // ======== 实时公交面板逻辑 ========
    function toggleLive(no) {
        const noStr = String(no);
        if (!LIVE_ROUTES[noStr]) return;
        // 如果已经开着其他线路的实时面板，先关掉
        if (liveState.panelEl && liveState.route !== noStr) {
            stopLivePoll();
            const oldBtn = document.querySelector('#route' + liveState.route + ' .live-btn') ||
                           document.querySelector('#route' + liveState.route + ' .tt-btn[onclick^="toggleLive"]');
            if (oldBtn) oldBtn.textContent = '实时 ▾';
            liveState.panelEl.classList.remove('on');
            liveState.panelEl = null;
        }
        const panel = document.getElementById('live' + no);
        const open = panel.classList.toggle('on');
        const btn = document.querySelector('#route' + no + ' [onclick="toggleLive(' + no + ')"]');
        if (open) {
            if (btn) btn.textContent = '实时 ▴';
            // 首次打开：构造面板内容 + 初始化方向
            if (!panel.dataset.init) {
                buildLivePanel(no, panel);
            }
            liveState.panelEl = panel;
            liveState.route = noStr;
            liveState.dir = '1';
            startLivePoll(noStr, '1');
        } else {
            if (btn) btn.textContent = '实时 ▾';
            stopLivePoll();
            liveState.panelEl = null;
            liveState.route = null;
        }
    }

    function buildLivePanel(no, panel) {
        panel.dataset.init = '1';
        const r = ROUTES[no];
        // 方向端点名：有 dirs 用 dirs 名，否则用 stops 首尾拼接
        const firstStop = r.stops[0];
        const lastStop = r.stops[r.stops.length - 1];
        const dirNames = r.dirs
            ? [r.dirs[0].name, r.dirs[1].name]
            : [firstStop + ' → ' + lastStop, lastStop + ' → ' + firstStop];
        panel.innerHTML =
            '<div class="live-head">' +
                '<span class="live-route">' + no + ' 路 · 实时</span>' +
                '<div class="live-dir-group">' +
                    '<button class="live-dir on" data-dir="1" onclick="liveSwitchDir(\'' + no + '\', \'1\')">' + esc(dirNames[0]) + '</button>' +
                    '<button class="live-dir" data-dir="2" onclick="liveSwitchDir(\'' + no + '\', \'2\')">' + esc(dirNames[1]) + '</button>' +
                '</div>' +
            '</div>' +
            '<div class="live-meta" id="liveMeta' + no + '">' +
                '<span>加载中…</span>' +
            '</div>' +
            '<div class="live-list" id="liveList' + no + '">' +
                '<div class="live-loader">正在连接实时数据…</div>' +
            '</div>';
    }

    function liveSwitchDir(no, dir) {
        if (liveState.route !== String(no) || liveState.dir === dir) return;
        liveState.dir = dir;
        const panel = document.getElementById('live' + no);
        panel.querySelectorAll('.live-dir').forEach(function(el) {
            el.classList.toggle('on', el.dataset.dir === dir);
        });
        // 先清空 list，立即拉
        const listEl = document.getElementById('liveList' + no);
        listEl.innerHTML = '<div class="live-loader">切换方向，刷新中…</div>';
        startLivePoll(String(no), dir);
    }

    function startLivePoll(line, dir) {
        stopLivePoll();
        liveState.running = true;
        liveState.failCount = 0;
        // 立即拉一次
        tickLive(line, dir);
        scheduleNext(line, dir, 5000);
    }

    function stopLivePoll() {
        liveState.running = false;
        if (liveState.timer) {
            clearTimeout(liveState.timer);
            liveState.timer = null;
        }
    }

    function scheduleNext(line, dir, delay) {
        if (!liveState.running) return;
        liveState.timer = setTimeout(function() {
            tickLive(line, dir);
            scheduleNext(line, dir, 5000);
        }, delay);
    }

    async function tickLive(line, dir) {
        if (!liveState.running) return;
        const reqKey = line + ':' + dir;
        const thisReq = ++liveState.currentReq;
        try {
            const res = await fetch(LIVE_URL + '?line=' + line + '&dir=' + dir, {
                headers: {'Accept': 'application/json'}
            });
            const body = await res.json();
            if (thisReq !== liveState.currentReq) return; // 已切方向，丢弃旧响应
            if (!res.ok || !body.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
            liveState.lastData = body;
            liveState.failCount = 0;
            renderLiveList(line, body);
        } catch (e) {
            if (thisReq !== liveState.currentReq) return;
            liveState.failCount++;
            renderLiveError(line, e.message);
        }
    }

    function renderLiveList(line, data) {
        const metaEl = document.getElementById('liveMeta' + line);
        const listEl = document.getElementById('liveList' + line);
        // meta 行
        const busCount = data.buses ? data.buses.length : 0;
        const timeStr = new Date(data.updatedAt).toLocaleTimeString('zh-CN', {hour12: false});
        let html = '<span><b>' + esc(data.beginTime || '--') + '</b> 首班 / <b>' + esc(data.endTime || '--') + '</b> 末班</span>';
        html += '<span>在线 <b>' + busCount + '</b> 辆车</span>';
        html += '<span>' + timeStr + ' 更新</span>';
        if (data.runState === 1) html += '<span class="live-state-warn">该线路已停运</span>';
        if (liveState.failCount > 0) html += '<span class="live-state-warn">数据可能延迟</span>';
        metaEl.innerHTML = html;

        // 站点列表
        const stations = data.stations || [];
        if (busCount === 0 && stations.length > 0) {
            listEl.innerHTML =
                '<div class="live-list-row"><div class="live-empty" style="padding:18px 0;flex:1;">暂无在线车辆</div></div>' +
                '<div class="live-list-row"><div class="live-station-num"></div><div class="live-station-name"><span class="lst">共 ' + stations.length + ' 个站点，首班 ' + esc(stations[0].name) + '，末班 ' + esc(stations[stations.length-1].name) + '</span></div></div>';
            return;
        }

        // index → 车辆数组 映射
        const busMap = {};
        (data.buses || []).forEach(function(b) {
            const i = b.stationIndex;
            if (!busMap[i]) busMap[i] = [];
            busMap[i].push(b);
        });

        let rows = [];
        stations.forEach(function(s, idx) {
            const num = idx + 1;
            const cls = (idx === 0 ? 'live-start' : (idx === stations.length - 1 ? 'live-end' : ''));
            const buses = busMap[idx] || [];
            let busHtml = '';
            buses.forEach(function(b) {
                const meters = b.meters;
                let distTxt;
                if (meters >= 1000) distTxt = (meters / 1000).toFixed(1) + ' km';
                else distTxt = meters + ' m';
                busHtml += '<div class="live-bus">' +
                    '<span class="lb-plate">' + esc(b.plate) + '</span>' +
                    '<span class="lb-sub">' + esc(b.state) + ' · ' + distTxt + '</span>' +
                '</div>';
            });
            rows.push('<div class="live-list-row">' +
                '<div class="live-station-num">' + num + '</div>' +
                '<div class="live-station-name"><span class="ln">' + esc(s.name) + '</span>' + (idx === 0 ? '<span class="lst">（起）</span>' : (idx === stations.length - 1 ? '<span class="lst">（终）</span>' : '')) + '</div>' +
                '<div class="live-buses">' + busHtml + '</div>' +
            '</div>');
        });
        listEl.innerHTML = rows.join('');
    }

    function renderLiveError(line, msg) {
        const metaEl = document.getElementById('liveMeta' + line);
        const listEl = document.getElementById('liveList' + line);
        const data = liveState.lastData;
        if (data) {
            // 有旧数据：保留列表，只在 meta 标 warning
            metaEl.innerHTML += '<span class="live-state-warn">请求失败（' + esc(msg) + '），显示上次数据</span>';
        } else {
            metaEl.innerHTML = '<span class="live-state-warn">实时数据加载失败</span>';
            listEl.innerHTML = '<div class="live-empty warn">请求实时公交失败：' + esc(msg) + '<br>请检查网络或稍后再试</div>';
        }
    }

    // 页面不可见时停止轮询，恢复可见立即刷新
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible' && liveState.running) {
            // 立即拉一次，保持 5 秒间隔
            stopLivePoll();
            startLivePoll(liveState.route, liveState.dir);
        }
    });

    buildTabs();
    buildRoutes();
    ['from', 'to'].forEach(function (id) {
        const el = document.getElementById(id);
        el.addEventListener('input', function () { touched = true; });
        el.addEventListener('change', function () { touched = true; refreshSegment(); });
        el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { el.blur(); refreshSegment(); }
        });
    });
    window.addEventListener('resize', function () {
        if (!touched) initDefault();
    });
    if (document.readyState === 'complete') {
        bootBus();
    } else {
        window.addEventListener('load', bootBus);
    }
    // 打开页面即展示实时公交，收起只能由用户点击「实时」按钮触发
    function bootBus() {
        initDefault();
        if (LIVE_ROUTES[String(current)]) toggleLive(current);
    }
</script>
</body>
